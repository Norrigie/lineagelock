/* =========================================================
   ENCOUNTER MODE (Rule 15) — First Encounter, or Spin the Wheel
   ========================================================= */
function encModeName(){
  return S.encMode === 'wheel'    ? '🎡 Spin the wheel'
       : S.encMode === 'first'    ? '👣 First encounter'
       : S.encMode === 'audition' ? '🎬 Audition'
       : S.encMode === 'all'      ? "🌍 Catch 'em all" : 'Not set';
}
// One catch per area, however it was chosen.
const oneEach = () => S.encMode === 'first' || S.encMode === 'audition';
const isAll = () => S.encMode === 'all';
function encKey(){ return S.game ? (ENC_ALIAS[S.game] || S.game) : null; }
function encTables(){ const k = encKey(); return (k && ENC[k]) || null; }
function hasEncData(){ const e = encTables(); return !!(e && Object.keys(e).length); }
function areasFor(){ return hasEncData() ? Object.keys(encTables()).sort() : []; }
// A slot is either a dex number or, for fan-made species, a plain name.
function slotName(x){ return typeof x === 'number' ? pretty(DEX[x-1] || '?') : String(x); }
function slotDex(x){ return typeof x === 'number' ? x : dexOf(x); }

function openEncModePicker(){
  const locked = S.mons.length > 0;
  sheet(`<h3>How do you pick what to catch?</h3>
    <p class="note" style="margin:0 0 14px">${locked
      ? '<b style="color:var(--gold)">Locked — this run has already started.</b>'
      : 'Locked in once you catch your first Pokémon.'}</p>
    <div class="modecard ${S.encMode==='first'?'on':''}" ${locked?'':'onclick="setEncMode(\'first\')"'}>
      <div class="mhead">👣 First encounter<span>${S.encMode==='first'?'CURRENT':''}</span></div>
      <div class="mbody">Classic Nuzlocke: the first wild Pokémon you meet in an area is the only one
        you may catch there. Simple, needs no data, works on every game and every ROM hack.</div>
    </div>
    <div class="modecard ${S.encMode==='wheel'?'on':''}" ${locked?'':'onclick="setEncMode(\'wheel\')"'}>
      <div class="mhead">🎡 Spin the wheel<span>${S.encMode==='wheel'?'CURRENT':''}</span></div>
      <div class="mbody">The tracker holds each area's real encounter table with its true appearance
        rates. Spin once per area and the wheel names your target — then go hunt it. Fixes the problem
        where the "first" Pokémon depends on which patch of grass you stepped in.</div>
    </div>
    <div class="modecard ${S.encMode==='audition'?'on':''}" ${locked?'':'onclick="setEncMode(\'audition\')"'}>
      <div class="mhead">🎬 Audition<span>${S.encMode==='audition'?'CURRENT':''}</span></div>
      <div class="mbody">Three encounters per area, and you catch whichever of the three you like —
        still only one catch there, ever. Choice without abundance: it sits between First encounter
        and Catch 'em all, and it needs no bundled data, so it works on any game. No dupes clause —
        you already had a choice.</div>
    </div>
    <div class="modecard ${S.encMode==='all'?'on':''}" ${locked?'':'onclick="setEncMode(\'all\')"'}>
      <div class="mhead">🌍 Catch 'em all<span>${S.encMode==='all'?'CURRENT':''}</span></div>
      <div class="mbody">No limit per area — catch every species you don't already own and fill the dex.
        The die still decides who gets a chair, so you end up with six lineages dozens deep and a Box
        full of contenders. The friendly one: best for a first run through a game you want to see all of.</div>
    </div>
    ${S.game && !hasEncData()
      ? `<p class="note" style="color:var(--gold)">Heads up: no encounter table is bundled for
         <b>${esc(gameName())}</b>, so the wheel has nothing to spin. First encounter and Catch 'em all
         both work fine.</p>` : ''}
    <div class="acts"><button class="btn ghost" onclick="closeSheet()">${locked?'Close':'Cancel'}</button></div>`);
}
function setEncMode(m){
  if (S.mons.length){ alert('This run has already started — the encounter rule is locked.'); return; }
  S.encMode = m;
  logIt(m==='wheel'?'🎡':m==='audition'?'🎬':m==='all'?'🌍':'👣',
    `Encounter rule set to <b>${esc(encModeName())}</b>.`);
  save(); render(); closeSheet();
}

// "Caught at" as a dropdown of this game's real locations, with a typed fallback
// for fan games and for anything the bundled list missed.
function whereField(cur){
  const areas = allAreas();
  if (!areas.length)
    return `<input type="text" id="fWhere" value="${esc(cur||'')}" placeholder="Route 1" autocomplete="off">`;
  const known = areas.includes(cur);
  return `<select id="fWhere" onchange="whereOther()">
      <option value="" ${!cur?'selected':''}>—</option>
      ${cur && !known ? `<option value="${esc(cur)}" selected>${esc(cur)}</option>` : ''}
      ${areas.map(a=>`<option value="${esc(a)}" ${a===cur?'selected':''}>${esc(a)}</option>`).join('')}
      <option value="__other">Somewhere else…</option>
    </select>
    <input type="text" id="fWhereOther" placeholder="type the location" autocomplete="off"
      style="margin-top:8px;display:none">`;
}
function whereOther(){
  const sel = document.getElementById('fWhere'), other = document.getElementById('fWhereOther');
  if (!sel || !other) return;
  other.style.display = sel.value === '__other' ? 'block' : 'none';
  if (sel.value === '__other') other.focus();
}
function readWhere(){
  const sel = document.getElementById('fWhere');
  if (!sel) return '';
  if (sel.tagName === 'INPUT') return sel.value.trim();
  if (sel.value === '__other') return (document.getElementById('fWhereOther').value || '').trim();
  return sel.value;
}

// ---- area + method selection ----
function openWheel(){
  if (!hasEncData()){
    sheet(`<h3>🎡 No table for this game</h3>
      <p class="note">There's no bundled encounter data for <b>${esc(gameName())}</b>.
        Catch normally and log it with the usual flow.</p>
      <div class="acts"><button class="btn" onclick="closeSheet();openCatch()">Log a catch instead</button></div>`);
    return;
  }
  const areas = areasFor();
  const cur = areas.includes(S.lastArea) ? S.lastArea : areas[0];
  sheet(`<h3>🎡 Spin for an encounter</h3>
    ${ENC_NOTE[S.game] ? `<p class="note" style="margin:0 0 8px;color:var(--gold)">${ENC_NOTE[S.game]}</p>` : ''}
    <label for="wArea">Where are you?</label>
    <select id="wArea" onchange="wheelMethods()">${areas.map(a=>
      `<option value="${esc(a)}" ${a===cur?'selected':''}>${esc(a)}</option>`).join('')}</select>
    <label for="wMethod">How are you looking?</label>
    <div id="wMethods"></div>
    <div class="acts">
      <button class="btn ghost" onclick="closeSheet()">Cancel</button>
      <button class="btn" onclick="spinScreen()">🎡 Spin</button>
    </div>`);
  wheelMethods();
}
function wheelMethods(){
  const area = document.getElementById('wArea').value;
  let ms = Object.keys(encTables()[area] || {});
  // Method Lock decides how you're allowed to look, so the wheel only spins that table.
  if (S.mlock && S.methods[area] && ms.includes(S.methods[area])) ms = [S.methods[area]];
  document.getElementById('wMethods').innerHTML = ms.length
    ? `<select id="wMethod">${ms.map((m,i)=>`<option value="${m}" ${i?'':'selected'}>${
        METHODS[m][1]} ${METHODS[m][0]} — ${encTables()[area][m].length} possible</option>`).join('')}</select>`
    : '<p class="note">No wild encounters recorded here.</p>';
}

// ---- the spin ----
const SEG = ['#ffc94a','#5aa9ff','#3ecf8e','#e8503a','#b07bff','#ff7ab8','#4dd0c1','#f0a35e',
             '#8e9bad','#c2e34d'];
let wheelPick = null;

function spinScreen(){
  const area = document.getElementById('wArea').value;
  const mEl = document.getElementById('wMethod');
  if (!mEl) return;
  const method = mEl.value;
  const table = encTables()[area][method];
  S.lastArea = area; save();

  // weighted pick first, then animate onto it
  const total = table.reduce((a,[,p])=>a+p,0);
  let roll = Math.random()*total, idx = 0;
  for (let i=0;i<table.length;i++){ roll -= table[i][1]; if (roll <= 0){ idx = i; break; } }
  wheelPick = { area, method, sp: table[idx][0], name: slotName(table[idx][0]),
                dex: slotDex(table[idx][0]), pct: table[idx][1] };

  // segment geometry
  let acc = 0;
  const segs = table.map(([sp,p],i)=>{
    const a0 = acc/total*360, a1 = (acc+p)/total*360; acc += p;
    return { sp, p, a0, a1, mid:(a0+a1)/2, col:SEG[i%SEG.length] };
  });
  const target = segs[idx];
  const spins = 4 + Math.floor(Math.random()*3);
  const end = spins*360 - target.mid;      // bring the winning midpoint to the 12 o'clock pointer

  const arc = (a0,a1)=>{
    const r=100, rad=d=>(d-90)*Math.PI/180;
    const x0=100+r*Math.cos(rad(a0)), y0=100+r*Math.sin(rad(a0));
    const x1=100+r*Math.cos(rad(a1)), y1=100+r*Math.sin(rad(a1));
    return `M100,100 L${x0.toFixed(2)},${y0.toFixed(2)} A${r},${r} 0 ${a1-a0>180?1:0},1 ${
      x1.toFixed(2)},${y1.toFixed(2)} Z`;
  };

  lockSheet(true);
  document.querySelector('.sheet').innerHTML = `
    <h3>${esc(area)}</h3>
    <p class="note" style="margin:0">${METHODS[method][1]} ${METHODS[method][0]} · ${
      table.length} possible</p>
    <div class="wheelwrap">
      <div class="ptr">▼</div>
      <svg viewBox="0 0 200 200" id="wheelSvg" class="wheel">
        <g id="wheelG">${segs.map(s=>
          `<path d="${arc(s.a0,s.a1)}" fill="${s.col}" stroke="#0e1117" stroke-width="1"/>`).join('')}
        </g>
        <circle cx="100" cy="100" r="18" fill="#151a23" stroke="#2c3542" stroke-width="2"/>
      </svg>
    </div>
    <div class="hint" id="wHint">Spinning…</div>
    <div id="wResult"></div>`;

  const g = document.getElementById('wheelG');
  g.style.transition = 'none';
  g.style.transform = 'rotate(0deg)';
  void g.getBoundingClientRect();
  g.style.transition = 'transform 3.2s cubic-bezier(.12,.72,.09,1)';
  g.style.transform = `rotate(${end}deg)`;
  setTimeout(wheelLanded, 3300);
}

function wheelLanded(){
  const p = wheelPick;
  const name = p.name;
  document.getElementById('wHint').textContent = '';
  document.getElementById('wResult').innerHTML = `
    <div class="verdict" style="margin-top:4px">
      <div class="big">YOUR ENCOUNTER</div>
      <div style="display:flex;justify-content:center;margin:8px 0 4px">${
        portrait({species:p.name, dex:p.dex},'lg')}</div>
      <div style="font-size:24px;font-weight:900">${esc(name)}</div>
      <p>${ENC_FLAT[S.game] ? 'One of ' + (encTables()[p.area][p.method]||[]).length +
        ' possible here (equal odds)' : p.pct + '% of encounters here'}. Go find one — that's the only Pokémon you may catch
        in <b>${esc(p.area)}</b>.</p>
    </div>
    <div class="acts">
      <button class="btn" onclick="wheelToCatch()">✅ Caught it — roll for lineage</button>
    </div>
    <div class="acts">
      <button class="btn ghost" onclick="closeSheet()">❌ Got away / not yet</button>
    </div>`;
  logIt('🎡', `Wheel in <b>${esc(p.area)}</b> (${METHODS[p.method][0]}) landed on
    <b>${esc(name)}</b> — ${p.pct}% odds.`);
  save(); render();
  lockSheet(false);
}

function wheelToCatch(){
  const p = wheelPick;
  openCatch({ species: p.name, where: p.area });
}

function battleList(){
  const preset = (S.game && GAMES[S.game]) ? GAMES[S.game].battles : [];
  return [...preset, ...S.custom.map(c=>[c.name, c.note||'Custom major', c.where||'', 'custom'])];
}
// post-league rematches are listed but don't count toward the run's progress
const isPost = b => b && b[3] === 'post';
function beatenCount(){ return battleList().filter((b,i)=>S.beat[i] && !isPost(b)).length; }
function mainCount(){ return battleList().filter(b=>!isPost(b)).length; }
function gameName(){
  if (!S.game) return 'No game set';
  if (S.game==='custom') return 'ROM hack / fan game';
  return GAMES[S.game] ? GAMES[S.game].name : 'Unknown game';
}

// Majors and Routes are both tick-off lists — one tab, one toggle.
let pane = 'battles';
function viewProgress(){
  return `<div class="sortbar" style="margin:18px 0 0">
      <button class="${pane==='battles'?'on':''}" onclick="pane='battles';render()">Major battles</button>
      <button class="${pane==='areas'?'on':''}" onclick="pane='areas';render()">Routes</button>
    </div>` + (pane === 'battles' ? viewBattles() : viewAreas());
}

function viewBattles(){
  if (!S.game) return `<h2 class="sec">Major battles</h2>
    <div class="empty"><span class="big">🎮</span>Pick your game first and the whole
      gym / Elite Four / boss run gets laid out for you.</div>
    <button class="btn" style="margin-top:12px" onclick="openGamePicker()">🎮 Choose your game</button>`;

  const list = battleList(), done = beatenCount(), total = mainCount();
  const pct = total ? Math.round(done/total*100) : 0;
  let h = `<h2 class="sec">Major battles <span class="tip">${gameName()}</span></h2>
    <div class="prog"><div class="bar"><span style="width:${pct}%"></span></div>
      <div class="pnum">${done} / ${total}</div></div>`;

  if (!list.length){
    h += `<div class="empty" style="margin-top:12px"><span class="big">🛠️</span>
      No preset list for a ROM hack or fan game — add the majors as you meet them.</div>`;
  } else {
    h += `<p class="note" style="margin:2px 0 12px">Tap a battle to mark it beaten.
      Anyone who fainted in it is <b>Winded</b> (Rule 26) — rotate them before the next one.</p>`;
    h += list.map((b,i)=>{
      const [label,col] = KIND[b[3]] || KIND.custom;
      const on = !!S.beat[i];
      return `<div class="bat ${on?'done':''}" onclick="toggleBattle(${i})">
        <div class="tick">${on?'✓':''}</div>
        <div class="binfo">
          <div class="bname">${esc(b[0])}</div>
          <div class="bmeta">${esc(b[1])}${b[2]?` · ${esc(b[2])}`:''}${
          b[4]?` · <b style="color:var(--gold)">Ace Level ${b[4]}</b>`:''}</div>
        </div>
        <div class="kind" style="color:${col};border-color:${col}33">${label}</div>
      </div>`;
    }).join('');
  }
  h += `<button class="btn ghost" style="margin-top:12px" onclick="openAddBattle()">+ Add a battle</button>
        <button class="btn ghost" style="margin-top:8px" onclick="openGamePicker()">🎮 Change game</button>`;
  return h;
}

function toggleBattle(i){
  const b = battleList()[i];
  if (!b) return;
  if (S.beat[i]){ delete S.beat[i]; save(); render(); return; }
  const owed = discharged();
  if (owed.length){ nagWinded(owed, i); return; }      // Rules 26–27 come first
  if (needsTour().length){ openTourRolls(); return; }  // and every chair needs a tour
  S.beat[i] = Date.now();
  logIt('🏆', `Beat <b>${esc(b[0])}</b>${b[1]?` — ${esc(b[1])}`:''}${b[2]?` (${esc(b[2])})`:''}.`);
  // Inside a chain there's no PC and no switching, so the whole run is one major (Rule 37):
  // tours tick once, the faint question is asked once, and the cap moves once — all at the end.
  const done = chainEnd(i);
  if (done && tours() && b[3] !== 'post') tickTours();
  capPending = done && b[3] !== 'post';
  save(); render();
  if (!done){
    const c = chainAt(i);
    logIt('⛓️', `No PC before <b>${esc(battleList()[i+1] ? battleList()[i+1][0] : 'the next fight')}</b> —
      faints, tours and the cap are held until <b>${esc(battleList()[c[1]][0])}</b> is down (Rule 37).`);
    save(); closeSheet(); render(); return;
  }
  const champInChain = (()=>{ const c = chainAt(i);
    if (!c) return b[3] === 'champ';
    for (let j = c[0]; j <= c[1]; j++) if (battleList()[j][3] === 'champ') return true;
    return false; })();
  if (champInChain && b[3] !== 'post'){ openSummary(); return; }   // that's the run
  if (!isPD() && party().length){ askWhoFainted(i); return; }
  postBattleFlow();
}

/* ---------- Tour of Duty (Rule 26) ----------
   Every Pokémon rolls 1d6 when it takes a chair: that's how many Major Battles it
   serves. Rotation mode only — Permadeath gets its churn from dying. */
const tours = () => !isPD();
// a party member with no tour rolled yet
function needsTour(){ return tours() ? party().filter(m => m.term == null) : []; }
// tour ran out (or a faint ended it early) AND there's someone to hand over to
function hasHeir(m){ return heirs(m.slot).some(x => x.id !== m.id); }
function discharged(){
  // There is no PC between Elite Four members, so a handover owed mid-gauntlet waits for
  // the far side of it. The debt isn't cancelled — Winded flags and spent tours persist,
  // and the gate fires for everyone at once when the Champion goes down.
  if (inGauntlet()) return [];
  const over = new Set(overCap().map(m => m.id));
  return party().filter(m =>
    hasHeir(m) && (over.has(m.id) || (tours() && (m.term === 0 || m.winded))));
}
// why is this one stepping down?
function dischargeReason(m){
  if (overCap().some(x => x.id === m.id)) return `is over the cap (Lv ${esc(m.level)} > ${capNum()})`;
  if (m.winded) return 'was Winded';
  return 'finished its tour';
}
function rollTourFor(id){
  const m = mon(id);
  if (!m) { closeSheet(); render(); return; }
  sheet('<h3>Tour of duty</h3>');
  rollScreen(`${esc(m.nick)} — how long?`,
    `Roll 1d${S.tourDie}: that many Major Battles before it hands the chair over.`, n => {
      m.term = n;
      logIt('📜', `<b>${esc(m.nick)}</b> takes the lineage ${m.slot} chair for a tour of
        <b>${n}</b> major${n===1?'':'s'}.`);
      save(); render();
      const next = needsTour()[0];
      if (next) rollTourFor(next.id); else postBattleFlow();
    }, S.tourDie);
}
let capPending = false;      // set when a major is beaten, consumed by the sequence below
function postBattleFlow(){
  if (discharged().length) return rotateGate();
  if (needsTour().length) return openTourRolls();
  if (capPending && S.levelCap){
    capPending = false;
    if (!nextMajor()){ closeSheet(); return; }        // run's over, nothing left to cap
    if (!capConfirmed()) return confirmCap();         // ask once per wall, then never again
    if (syncCap()) logIt('📏', `Cap now <b>Lv ${S.cap}</b> for <b>${esc(wallName())}</b>.`);
    save(); render();
    if (overCap().length) return rotateGate();
    closeSheet(); return;
  }
  closeSheet();
}

function openTourRolls(){
  const n = needsTour()[0];
  if (n) rollTourFor(n.id);
}

/* ---------- Winded (Rule 27) ----------
   A Pokémon that faints in a Major Battle must rotate out before the next one —
   unless its lineage has nobody else, in which case it simply stays. */
function windedList(){ return S.mons.filter(m => m.winded && m.status === 'party'); }
// only those that CAN rotate actually owe you one
function windedOwed(){
  return windedList().filter(m =>
    lineage(m.slot).some(x => x.id !== m.id && x.status === 'boxed'));
}
function clearStuckWinded(){
  let changed = false;
  for (const m of windedList())
    if (!lineage(m.slot).some(x => x.id !== m.id && x.status === 'boxed')){ m.winded = false; changed = true; }
  return changed;
}
// one major down: every tour shortens by one
function tickTours(){
  for (const m of party()){
    if (typeof m.term !== 'number') continue;
    m.term = Math.max(0, m.term - 1);
    if (m.term === 0 && !hasHeir(m)){
      m.term = null;                       // an only child re-enlists
      logIt('📜', `<b>${esc(m.nick)}</b>'s tour ended with nobody to replace it — re-enlisting.`);
    } else if (m.term === 0){
      logIt('📜', `<b>${esc(m.nick)}</b>'s tour is up — it hands lineage ${m.slot} over.`);
    }
  }
}

function askWhoFainted(i){
  const p = party();
  const c = i >= 0 ? chainAt(i) : null;
  const many = c && c[1] > c[0];
  sheet(`<h3>Anyone faint?</h3>
    <p class="note" style="margin:0 0 10px">Tap everyone who went down ${many
      ? `anywhere in <b>${esc(gauntletName() || 'that run of fights')}</b> — it counted as one
         battle, so this is asked once at the end of it (Rule 37)`
      : 'in that fight'}. They become <b>Winded</b> (Rule 27) and hand their chair over
      <b>right away</b> — unless their lineage has nobody else, in which case they simply stay.</p>
    ${p.map(m=>`<div class="row" onclick="markWinded(${m.id}, this)">
      ${portrait(m,'sm')}
      <div class="info"><div class="nick">${esc(m.nick)} ${genderMark(m.gender)}</div>
        <div class="meta">lineage ${m.slot} · ${lineage(m.slot).filter(x=>x.status==='boxed').length} on the bench</div></div>
      <span class="wtick" id="w${m.id}">${m.winded?'💨':''}</span>
    </div>`).join('')}
    <div class="acts">
      <button class="btn ghost" onclick="nobodyFainted()">Nobody fainted</button>
      <button class="btn" onclick="finishWinded()">Done</button>
    </div>`);
  lockSheet(true);   // you answer this one way or the other
}
function markWinded(id, el){
  const m = mon(id); if (!m) return;
  m.winded = !m.winded;
  const tick = document.getElementById('w'+id);
  if (tick) tick.textContent = m.winded ? '💨' : '';
  if (el) el.style.borderColor = m.winded ? 'var(--gold)' : '';
  save();
}
// one tap for the common case: clean sweep, nothing to rotate
function nobodyFainted(){
  for (const m of party()) m.winded = false;
  save(); render();
  postBattleFlow();          // a clean fight can still end a tour
}
function finishWinded(){
  const w = windedList();
  if (w.length) logIt('💨', `<b>${w.map(m=>esc(m.nick)).join(', ')}</b> ${w.length===1?'is':'are'}
    <b>Winded</b> — tour over.`);
  clearStuckWinded();
  save(); render();
  postBattleFlow();          // Rule 27: the handover happens now, not "before the next major"
}

/* ---------- the rotation gate ----------
   Locked open until every Winded Pokémon with a bench has actually been rotated out.
   No skip button: leaving it open is the only thing you could do instead, and the
   debt would still be sitting there. */
function rotateGate(){
  const owed = discharged();
  if (!owed.length){
    save(); render();
    postBattleFlow();
    return;
  }
  sheet(`<h3>🔄 Rotate now</h3>
    <p class="note" style="margin:0 0 12px">${owed.length===1?'This Pokémon':'These Pokémon'} went down in
      that battle, so ${owed.length===1?'it':'they'} ${owed.length===1?'hands':'hand'} the chair over
      <b>straight away</b> (Rule 26) — not later, not just before the next gym. Head to a PC and pick
      ${owed.length===1?'its':'their'} successor.</p>
    ${owed.map(m=>`<div class="grouphead" style="margin:14px 0 6px">
        <div class="pill">${m.slot}</div>
        <span>${esc(m.nick)} ${dischargeReason(m)} — pick the next lineage ${m.slot}${
          m.level?(()=>{ const c=capNum(); const tgt=c?Math.min(parseInt(m.level,10)||0,c):parseInt(m.level,10);
            return `. Catch-Up Clause: train the successor to <b style="color:var(--gold)">Lv ${tgt}</b>${c&&tgt===c?' (the cap)':''}`; })():''}</span></div>
      ${(()=>{ const bench = heirs(m.slot);
        const rows = bench.map((h,i)=>`<div class="row">
          ${S.succession==='random'?`<div class="lin">${i+1}</div>`:''}
          ${portrait(h,'sm')}
          <div class="info"><div class="nick">${esc(h.nick)} ${genderMark(h.gender)}</div>
            <div class="meta">${esc(pretty(h.species))}${h.level?` · Lv ${h.level}`:''}</div></div>
          ${S.succession==='random'?'':`<button class="sw" onclick="rotateInto(${h.id})">Field</button>`}
        </div>`).join('');
        return rows + (S.succession==='random'
          ? `<div class="acts"><button class="btn" onclick="drawHeir(${m.slot})">🎲 Roll for the successor${
              bench.length<6?` (re-roll above ${bench.length})`:''}</button></div>`
          : ''); })()}`).join('')}
    <div class="acts"><button class="btn ghost" onclick="undoFaint()">↩ I tapped the wrong one</button></div>`);
  lockSheet(true);
}
// Rule 30: the lineage decides, not you. Roll 1d6 and count down the bench.
function drawHeir(slot){
  const bench = heirs(slot);
  if (!bench.length) return;
  if (bench.length === 1) return rotateInto(bench[0].id);
  if (bench.length > 6){                       // too deep for one d6 — draw it
    const pick = bench[Math.floor(Math.random()*bench.length)];
    logIt('🎲', `Succession drawn: <b>${esc(pick.nick)}</b> takes lineage ${slot}.`);
    return rotateInto(pick.id);
  }
  lockSheet(false);
  sheet('<h3>Succession</h3>');
  rollScreen(`Lineage ${slot} — who inherits?`,
    `Roll 1d6. 1–${bench.length} picks that Pokémon; anything higher, roll again.`, n => {
      if (n > bench.length){
        const h = document.getElementById('hint');
        if (h) h.innerHTML = `<b style="color:var(--gold)">${n} is above ${bench.length} — roll again.</b>`;
        const btn = document.getElementById('rollBtn');
        if (btn){ btn.disabled = false; btn.style.filter = ''; }
        return;
      }
      const pick = bench[n-1];
      logIt('🎲', `Rolled <b>${n}</b> — <b>${esc(pick.nick)}</b> inherits lineage ${slot}.`);
      rotateInto(pick.id);
    });
}

/* =========================================================
   ROUTES & LOCATIONS (Rule 15)
   Every place in the game where something is catchable — routes, caves, and the
   cities you can only fish or surf in. Derived from the same encounter tables the
   wheel uses, so nothing catchable is missing.
   ========================================================= */
let areaQ = '';        // search box
let areaFilter = 'all';

function allAreas(){
  const base = hasEncData() ? Object.keys(encTables()) : [];
  return [...base, ...S.customAreas].sort(natcmp);
}
// "Route 2" before "Route 10"
function natcmp(a,b){
  return String(a).localeCompare(String(b), undefined, {numeric:true, sensitivity:'base'});
}
function areaMethods(a){
  const tb = hasEncData() ? encTables()[a] : null;
  return tb ? Object.keys(tb) : [];
}
// Sub-areas are one catching location, so a record saying 'Mt Moon B2F' still ticks 'Mt Moon'.
// Sub-areas are one catching location. A floor token ends the real place name, so a record
// saying 'Mt Moon B2F' or 'Iron Island B1F Left' still ticks 'Mt Moon' / 'Iron Island'.
function deFloor(s){
  let n = String(s||'').replace(/\s+b?\d+\s*f[a-z]*\b.*$/i, '').trim() || String(s||'');
  const tail = [
    /\s+(from\s+)?exterior(\s+\w+)?$/i,
    /\s+(entrance|interior|inside|outside|summit|peak)(\s+[a-z])?$/i,
    /\s+room\s*\d+$/i,
    /\s+\w+\s+room$/i,
    /\s+(left|right|top|bottom|middle|back|front)$/i ];
  for (let i = 0; i < 5; i++) for (const re of tail){
    const next = n.replace(re, '').trim();
    if (next && next.split(/\s+/).length >= 2) n = next;
  }
  return n;
}

// Which areas already have a catch logged against them?
function areaCatches(){
  const map = {};
  const areas = allAreas();
  for (const m of S.mons){
    if (!m.where) continue;
    if (m.shiny && S.shinyClause) continue;    // a shiny is a freebie, not the area's catch
    const w = norm(m.where);
    if (!w) continue;
    const wf = norm(deFloor(m.where));
    let hit = areas.find(a => norm(a) === w || norm(a) === wf);
    if (!hit) hit = areas.find(a => { const n = norm(a); return w.length >= 5 && n.endsWith(w); });
    if (hit) (map[hit] ||= []).push(m);
  }
  return map;
}
// Catch 'em all: how much of this area's table have you actually caught?
function areaSpecies(a){
  const tb = hasEncData() ? encTables()[a] : null;
  if (!tb) return null;
  const names = new Set();
  for (const m of Object.keys(tb)) for (const [sp] of tb[m]) names.add(norm(slotName(sp)));
  if (!names.size) return null;
  const owned = new Set(S.mons.map(m => norm(m.species)));
  let got = 0;
  for (const n of names) if (owned.has(n)) got++;
  return { got, total: names.size };
}

// Areas counted as used: a logged catch, or ticked by hand.
function areaDone(){
  const done = new Set(Object.keys(areaCatches()));
  for (const a in S.areas) if (S.areas[a] === 'c') done.add(a);
  return done;
}
function areaState(a, catches){
  if (isAll()){
    const p = areaSpecies(a);
    if (p && p.got >= p.total) return 'caught';
    if (S.areas[a] === 'c') return 'caught';
    if (S.areas[a] === 'b') return 'burned';
    return 'open';
  }
  if (catches[a]) return 'caught';
  if (S.areas[a] === 'c') return 'caught';
  if (S.areas[a] === 'b') return 'burned';
  return 'open';
}
// tap cycles: open -> caught -> burned -> open  (a logged catch can't be un-ticked)
function cycleArea(a){
  const catches = areaCatches();
  if (catches[a]){
    alert(`${catches[a].map(m=>m.nick).join(', ')} was caught in ${a}, so it stays ticked.`);
    return;
  }
  const cur = S.areas[a];
  if (!cur) S.areas[a] = 'c';
  else if (cur === 'c') S.areas[a] = 'b';
  else delete S.areas[a];
  save(); render();
}

function viewAreas(){
  const areas = allAreas();
  if (!areas.length){
    return `<h2 class="sec">Routes &amp; locations</h2>
      <div class="empty"><span class="big">🗺️</span>No location list bundled for
        <b>${esc(gameName())}</b>.<br>Add the places you visit as you go.</div>
      <button class="btn ghost" style="margin-top:12px" onclick="openAddArea()">+ Add a location</button>`;
  }
  const catches = areaCatches();
  const done = areaDone();
  const burned = areas.filter(a => areaState(a,catches) === 'burned').length;
  const pct = Math.round(done.size/areas.length*100);

  const term = norm(areaQ);
  let shown = areas.filter(a => !term || norm(a).includes(term));
  if (areaFilter === 'open')   shown = shown.filter(a => areaState(a,catches) === 'open');
  if (areaFilter === 'done')   shown = shown.filter(a => areaState(a,catches) !== 'open');

  let h = `<h2 class="sec">Routes &amp; locations <span class="tip">${esc(gameName())}</span></h2>
    <div class="prog"><div class="bar"><span style="width:${pct}%"></span></div>
      <div class="pnum">${done.size} / ${areas.length}</div></div>
    ${isAll() ? (()=>{ const owned = new Set(S.mons.map(m=>norm(m.species)));
        const all = new Set(); for (const a of areas){ const tb = hasEncData()?encTables()[a]:null;
          if (tb) for (const m of Object.keys(tb)) for (const [sp] of tb[m]) all.add(norm(slotName(sp))); }
        let got = 0; for (const n of all) if (owned.has(n)) got++;
        return `<p class="note" style="margin:-4px 0 10px"><b style="color:var(--gold)">${got}/${all.size}</b>
          catchable species owned across the whole game.</p>`; })() : ''}
    <p class="note" style="margin:0 0 10px">Everywhere something is catchable, including towns you can
      only fish or surf in.${isAll()
        ? " Each row shows how much of that area's table you've caught, and ticks itself once you've cleared it."
        : ` Tap to cycle: <b>open → caught → burned</b>. Anywhere you've logged a catch ticks itself.${
            burned?` <b style="color:var(--red)">${burned} burned.</b>`:''}`}</p>
    <input type="text" id="areaQ" value="${esc(areaQ)}" placeholder="search ${areas.length} locations…"
      autocomplete="off" oninput="areaQ=this.value;renderAreaList()">
    <div class="sortbar" style="margin-top:8px">${
      [['all','All'],['open','Remaining'],['done','Used']].map(([k,l])=>
        `<button class="${areaFilter===k?'on':''}" onclick="areaFilter='${k}';render()">${l}</button>`).join('')}
    </div>
    <div id="areaList">${areaRows(shown, catches)}</div>
    <button class="btn ghost" style="margin-top:12px" onclick="openAddArea()">+ Add a location</button>`;
  return h;
}

function areaRows(shown, catches){
  if (!shown.length) return '<div class="empty">Nothing matches.</div>';
  return shown.map(a=>{
    const st = areaState(a, catches);
    const ms = areaMethods(a);
    const got = catches[a];
    const tick = st==='caught' ? '✓' : st==='burned' ? '🔥' : '';
    return `<div class="bat ${st==='caught'?'done':''} ${st==='burned'?'burned':''}"
        onclick="cycleArea('${a.replace(/'/g,"\\'")}')">
      <div class="tick">${tick}</div>
      <div class="binfo">
        <div class="bname">${esc(a)}</div>
        <div class="bmeta">${isAll() && areaSpecies(a)
          ? (()=>{ const p = areaSpecies(a);
              return `<b style="color:${p.got>=p.total?'var(--green)':'var(--gold)'}">${p.got}/${p.total}</b> species caught`; })()
          : got
          ? 'caught ' + got.map(m=>esc(m.nick)).join(', ')
          : st==='burned' ? 'burned — no catch here'
          : ms.length ? ms.map(m=>METHODS[m][1]+' '+METHODS[m][0]).join(' · ')
          : 'added by you'}</div>
      </div>
      ${S.mlock && ms.length > 1 ? `<div class="kind" title="Method lock"
        style="border-color:var(--line);color:${S.methods[a]?'var(--gold)':'var(--dim)'}"
        onclick="event.stopPropagation();rollMethod('${a.replace(/'/g,"\\'")}')">${
        S.methods[a] ? METHODS[S.methods[a]][1] + ' ' + esc(METHODS[S.methods[a]][0]) : '🎲 method'}</div>` : ''}
      ${ms.length ? `<div class="kind" style="color:var(--dim);border-color:var(--line)">${
        ms.reduce((n,m)=>n+(encTables()[a][m]||[]).length,0)} mons</div>` : ''}
    </div>`;
  }).join('');
}
// Rule 34: the die decides how you're allowed to look in an area, not just what you find.
function rollMethod(a){
  const ms = areaMethods(a);
  if (ms.length < 2) return;
  if (S.methods[a] && !confirm(`${a} is locked to ${METHODS[S.methods[a]][0]}. Roll it again?`)) return;
  sheet('<h3>🎣 Method lock</h3>');
  rollScreen(`${esc(a)} — how are you allowed to look?`,
    `Roll 1d${ms.length}: ${ms.map((m,i)=>`<b>${i+1}</b> ${METHODS[m][1]} ${METHODS[m][0]}`).join(' · ')}`,
    x => {
      const pick = ms[x-1];
      S.methods[a] = pick;
      logIt('🎣', `<b>${esc(a)}</b> locked to <b>${METHODS[pick][1]} ${esc(METHODS[pick][0])}</b>.`);
      save(); render(); closeSheet();
    }, ms.length);
}

// keep focus while typing in the search box
function renderAreaList(){
  const catches = areaCatches();
  const term = norm(areaQ);
  let shown = allAreas().filter(a => !term || norm(a).includes(term));
  if (areaFilter === 'open') shown = shown.filter(a => areaState(a,catches) === 'open');
  if (areaFilter === 'done') shown = shown.filter(a => areaState(a,catches) !== 'open');
  const box = document.getElementById('areaList');
  if (box) box.innerHTML = areaRows(shown, catches);
}

function sheet(html){
  closeSheet();
  const s = document.createElement('div');
  s.className = 'scrim';
  s.innerHTML = `<div class="sheet">${html}</div>`;
  s.addEventListener('click', e=>{ if (e.target===s && !s.dataset.lock) closeSheet(); });
  document.body.appendChild(s);
  return s;
}
function closeSheet(){ document.querySelectorAll('.scrim').forEach(x=>x.remove()); }
function lockSheet(v){
  const s = document.querySelector('.scrim');
  if (s){ if (v) s.dataset.lock='1'; else delete s.dataset.lock; }
}

/* =========================================================
   NICKNAME THEMES (Rules 23–24)
   ========================================================= */
function themeOptions(sel){
  const bundled = Object.keys(POOLS).map(c=>
    `<option value="${c}" ${c===sel?'selected':''}>${POOLS[c].icon} ${POOLS[c].label}</option>`).join('');
  const live = Object.keys(LIVE_THEMES).map(c=>
    `<option value="${c}" ${c===sel?'selected':''}>${LIVE_THEMES[c][1]} ${LIVE_THEMES[c][0]}${S.apiKey?'':' ⚡'}</option>`).join('');
  return `<optgroup label="Bundled — work offline">${bundled}</optgroup>
          <optgroup label="${S.apiKey?'Live via your API key':'Live only ⚡ — needs an API key'}">${live}</optgroup>`;
}

// Bundled pools mirror Behind the Name's own split: masculine, feminine, and unisex.
// A male Pokémon draws from masculine + unisex, a female from feminine + unisex,
// and a genderless (or unrecorded) one from everything.
function genderedPool(theme, g){
  const p = POOLS[theme] || POOLS['sca-myth'];
  if (g === 'm') return [...p.m, ...p.u];
  if (g === 'f') return [...p.f, ...p.u];
  return [...p.m, ...p.f, ...p.u];
}

async function rollName(){
  const sel = document.getElementById('fTheme');
  const inp = document.getElementById('fNick');
  const btn = document.getElementById('nameBtn');
  if (!sel || !inp) return;
  const g = (document.getElementById('fGender')||{}).value || '';
  S.theme = sel.value; save();
  btn.textContent = '⏳';
  btn.title = '';
  let name = null;

  if (S.apiKey){
    try{
      // gender=m / gender=f is Behind the Name's own parameter; omitted for genderless
      const gq = (g==='m'||g==='f') ? `&gender=${g}` : '';
      const r = await fetch(`https://www.behindthename.com/api/random.json?number=6&usage=${
        encodeURIComponent(S.theme)}${gq}&key=${encodeURIComponent(S.apiKey)}`);
      const j = await r.json();
      const list = Array.isArray(j) ? j : (j.names || []);
      if (j.error) throw new Error(j.error);
      const fresh = list.filter(n=>!S.used.includes(n));
      name = (fresh.length ? fresh : list)[Math.floor(Math.random()*(fresh.length||list.length))];
    }catch(e){
      btn.title = 'Live lookup failed: ' + e.message;
    }
  }
  if (!name){
    const pool = genderedPool(S.theme, g);
    const fresh = pool.filter(n=>!S.used.includes(n));
    const from = fresh.length ? fresh : pool;
    name = from[Math.floor(Math.random()*from.length)];
    if (!POOLS[S.theme] && !S.apiKey)
      btn.title = 'That theme needs an API key — rolled from the bundled pool instead.';
  }
  inp.value = name;
  inp.dataset.rolled = name;          // so a later gender change knows it may re-roll
  btn.textContent = '🎲';
  showNameNote(name, g);
}

// A surprising name is usually correct rather than broken — Papa is feminine, it's the Maori
// earth goddess — so name the pool it was drawn from and link to the entry.
function showNameNote(name, g){
  const box = document.getElementById('nickNote');
  if (!box) return;
  if (!name){ box.innerHTML = ''; return; }
  const where = g === 'm' ? 'masculine + unisex'
              : g === 'f' ? 'feminine + unisex'
              : g === 'n' ? 'the whole theme (genderless)'
              : null;
  const slug = String(name).toLowerCase().replace(/[^a-z0-9]+/g, '-');
  const link = `<a href="https://www.behindthename.com/name/${slug}" target="_blank"
    rel="noopener" style="color:var(--dim)">check ${esc(name)} ›</a>`;
  box.innerHTML = where
    ? `<span style="color:var(--dim)">drawn from <b>${where}</b> · ${link}</span>`
    : `<span style="color:var(--gold)">no gender set yet — drawn from every name in the theme.
       Set the gender and the die re-rolls.</span>`;
}
// Re-roll only if the box still holds exactly what the die gave, so typed names are never lost.
function genderChanged(){
  const inp = document.getElementById('fNick');
  refreshAbility();
  if (!inp) return;
  const rolled = inp.dataset.rolled || '';
  if (rolled && inp.value.trim() === rolled) rollName();
  else if (!inp.value.trim()) showNameNote('', '');
}

/* ---------- backup ---------- */
function download(name, text){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type:'application/json'}));
  a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 0);
}
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'run';
function exportRun(){
  download(`lineagelock-${slug(S.name)}.json`, JSON.stringify({ type:'lineagelock-run', v:1, run:S }, null, 1));
}
function exportAll(){
  download('lineagelock-all-runs.json', JSON.stringify({ type:'lineagelock-backup', v:1, runs:DB.runs }, null, 1));
}
function importRuns(input){
  const f = input.files && input.files[0];
  if (!f) return;
  const status = document.getElementById('impStatus');
  const rd = new FileReader();
  rd.onload = () => {
    let data;
    try { data = JSON.parse(rd.result); }
    catch(e){ status.innerHTML = '<b style="color:var(--red)">That file isn\'t valid JSON.</b>'; return; }
    let runs = data && data.run ? [data.run] : (data && Array.isArray(data.runs) ? data.runs : null);
    if (!runs || !runs.length){ status.innerHTML = '<b style="color:var(--red)">No runs found in that file.</b>'; return; }
    let n = 0;
    for (const r of runs){
      if (!r || !Array.isArray(r.mons)) continue;
      const copy = fixRun(JSON.parse(JSON.stringify(r)), DB.runs.length);
      copy.id = uid();                                   // never clobber an existing run
      if (DB.runs.some(x => x.name === copy.name)) copy.name = copy.name + ' (imported)';
      DB.runs.push(copy); n++;
    }
    save(); render();
    status.innerHTML = n ? `Imported <b>${n}</b> run${n===1?'':'s'}. They're in your run list.`
                         : '<b style="color:var(--red)">Nothing importable in that file.</b>';
  };
  rd.readAsText(f);
}

  sheet(`<h3>💾 Backup &amp; transfer</h3>

/* ---------- run summary ---------- */
function summaryData(){
  const p = party(), f = fallen(), list = battleList();
  const majors = list.filter((b,i)=>S.beat[i] && b[3]!=='post');
  const depth = [1,2,3,4,5,6].map(n=>({ n, all:lineage(n).length }));
  const deepest = depth.slice().sort((a,b)=>b.all-a.all)[0];
  const veteran = p.slice().sort((a,b)=>a.caughtAt-b.caughtAt)[0];
  const areas = areaDone().size, areaTotal = allAreas().length;
  return { p, f, majors, mainTotal:mainCount(), depth, deepest, veteran, areas, areaTotal };
}
function summaryText(){
  const d = summaryData();
  const L = [];
  L.push(`LINEAGELOCK — ${S.name}`);
  L.push(`${modeName().replace(/^\S+\s/,'')} · ${gameName()} · ${encModeName().replace(/^\S+\s/,'')}`);
  L.push('');
  L.push(`Majors beaten   ${d.majors.length}/${d.mainTotal}`);
  L.push(`Caught          ${S.mons.length}`);
  if (isPD()) L.push(`Fallen          ${d.f.length}`);
  if (d.areaTotal) L.push(`Areas used      ${d.areas}/${d.areaTotal}`);
  L.push(`Deepest lineage ${d.deepest.all} in slot ${d.deepest.n}`);
  if (d.veteran) L.push(`Longest serving ${d.veteran.nick} (${pretty(d.veteran.species)})`);
  L.push('');

  if (d.f.length){ L.push(''); L.push('Fallen:'); d.f.forEach(m=>L.push(`  ${m.nick} — ${pretty(m.species)}`)); }
  return L.join('\n');
}

function copySummary(btn){
  const txt = summaryText();
  const done = ()=>{ btn.textContent = '✓ Copied'; };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(txt).then(done, ()=>fallbackCopy(txt, done));
  else fallbackCopy(txt, done);
}
function fallbackCopy(txt, done){
  const ta = document.createElement('textarea');
  ta.value = txt; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch(e){}
  ta.remove();
}

// First Encounter mode gives you one catch per area — say so before it's logged.
function areaAlreadyUsed(where){
  if (!oneEach() || !where) return null;
  const w = norm(deFloor(where));
  return S.mons.find(m => m.where && !(m.shiny && S.shinyClause) &&
    norm(deFloor(m.where)) === w) || null;
}

  save();

  if (clash && !pending.forced){
    sheet(`<h3>⚠️ Already caught there</h3>

/* ---------- dice ---------- */
function cubeHTML(){
  const face = n => `<div class="face f${n}">` +
    Array.from({length:9},(_,i)=> PIPS[n].includes(i)
      ? `<div class="pip${n===1?' r':''}"></div>` : '<div></div>').join('') + '</div>';
  return `<div class="stage"><div><div class="cube" id="cube">
    ${[1,2,3,4,5,6].map(face).join('')}</div><div class="shadow" id="shadow"></div></div></div>`;
}
const FACE = {1:[0,0], 2:[0,-90], 3:[-90,0], 4:[90,0], 5:[0,90], 6:[0,180]};

let rollHandler = null;
// A cube can only show six faces, so anything else (a d4 tour, a 3-method lock) gets a
// numeric tumbler instead. Both accept your own die's verdict the same way.
function tumblerHTML(){
  return `<div class="stage"><div id="tumbler" style="font-size:62px;font-weight:900;line-height:1;
    padding:24px 0;cursor:pointer;color:var(--gold);text-align:center;width:100%">?</div></div>`;
}
function rollScreen(title, hint, onLand, sides){
  const N = sides || 6;
  lockSheet(true);
  rollHandler = onLand;
  document.querySelector('.sheet').innerHTML =
    `<h3>${title}</h3>${N === 6 ? cubeHTML() : tumblerHTML()}
     <div class="hint" id="hint">${hint}</div>
     <div class="acts"><button class="btn" id="rollBtn" onclick="doRoll(${N})">🎲 Roll it for me</button></div>
     <p class="note" style="text-align:center;margin:14px 0 6px">…or roll your own die and tap what it landed on</p>
     <div class="pips" style="flex-wrap:wrap">${Array.from({length:N},(_,i)=>i+1).map(n=>
       `<button class="pipbtn" onclick="ownRoll(${n})">${n}</button>`).join('')}</div>`;
  const c = document.getElementById('cube');   if (c) c.onclick = () => doRoll(N);
  const u = document.getElementById('tumbler'); if (u) u.onclick = () => doRoll(N);
}

// The rules put a real die on your desk (Setup 5) — so the app has to accept its verdict,
// not overrule it with its own random number.
function ownRoll(n){
  if (rolling) return;
  const cube = document.getElementById('cube');
  if (cube){ cube.style.transition = 'none'; freezeCube(n); }
  const tum = document.getElementById('tumbler');
  if (tum) tum.textContent = n;
  const hint = document.getElementById('hint');
  if (hint) hint.textContent = 'You rolled ' + n + '.';
  rollHandler(n);
}

let rolling = false;
function doRoll(sides){
  if (rolling) return;
  const N = sides || 6;
  rolling = true;
  const n = 1 + Math.floor(Math.random()*N);
  const cube = document.getElementById('cube');
  const btn = document.getElementById('rollBtn');
  btn.disabled = true; btn.style.filter = 'grayscale(.6)';
  document.getElementById('hint').textContent = 'Tumbling…';
  if (!cube){
    const el = document.getElementById('tumbler');
    let ticks = 0;
    const iv = setInterval(()=>{
      el.textContent = 1 + Math.floor(Math.random()*N);
      if (++ticks > 13){ clearInterval(iv); el.textContent = n; rolling = false; rollHandler(n); }
    }, 70);
    return;
  }
  document.getElementById('shadow').style.transform = 'scale(.6)';

  const [fx, fy] = FACE[n];
  const spinX = 360 * (3 + Math.floor(Math.random()*3));
  const spinY = 360 * (2 + Math.floor(Math.random()*3));
  // Snap to a wound-up start with no transition, force a reflow so the browser
  // can't coalesce the two writes, then let it unwind onto the rolled face.
  cube.classList.remove('rolling');
  cube.style.transition = 'none';
  cube.style.transform = `rotateX(${fx - spinX}deg) rotateY(${fy + spinY}deg)`;
  void cube.offsetHeight;
  cube.style.transition = '';
  cube.classList.add('rolling');
  cube.style.transform = `rotateX(${fx}deg) rotateY(${fy}deg)`;

  setTimeout(()=>{
    document.getElementById('shadow').style.transform = 'scale(1)';
    rolling = false;
    rollHandler(n);
  }, 1650);
}
function freezeCube(n){
  const c = document.getElementById('cube');
  if (!c) return;
  c.style.transition = 'none';
  c.style.transform = `rotateX(${FACE[n][0]}deg) rotateY(${FACE[n][1]}deg)`;
}

/* ---------- starter: two rolls (Rule 12) ---------- */
const STARTERS = [
  {type:'GRASS', icon:'🌿', col:'var(--green)', faces:'1–2', eg:'Bulbasaur'},
  {type:'FIRE',  icon:'🔥', col:'var(--red)',   faces:'3–4', eg:'Charmander'},
  {type:'WATER', icon:'💧', col:'var(--blue)',  faces:'5–6', eg:'Squirtle'}
];
function openStarter(){
  if (S.starter === 'full'){
    sheet('<h3>Starter</h3>');
    rollScreen('Starter — roll 1 of 2',
      'Which one? <b>1–2 Grass · 3–4 Fire · 5–6 Water</b>', starterPicked);
    return;
  }
  const trad = S.starter === 'trad';
  sheet(`<div class="catchhead"><div id="prev">${portrait({species:'?'},'lg')}</div>
      <h3 style="margin:0">Starter</h3></div>
    <p class="note" style="margin:0 0 10px">${trad
      ? 'Traditional: you pick your starter and it anchors <b>lineage 1</b>. No rolls (Rule 36).'
      : 'Half traditional: you pick which starter, the die still picks its lineage (Rule 36).'}</p>
    ${catchForm({level:'5', where:'Starter'})}
    <div class="acts">
      <button class="btn ghost" onclick="closeSheet()">Cancel</button>
      <button class="btn" onclick="${trad ? 'tradStarter()' : 'toRoll()'}">${
        trad ? '✅ Take it as lineage 1' : '🎲 Roll for its lineage'}</button>
    </div>`);
  setTimeout(()=>{ const el = document.getElementById('spQ') || document.getElementById('fSpecies');
    if (el) el.focus(); }, 120);
}
// Traditional style: no roll at all, the starter simply founds lineage 1.
function tradStarter(){
  afterForm = () => commit(1);
  toRoll();
}
function starterPicked(n){
  const s = STARTERS[Math.floor((n-1)/2)];
  document.querySelector('.sheet').innerHTML =
    `${cubeHTML()}
     <div class="verdict">
       <div class="big">ROLLED</div>
       <div class="rolled" style="color:${s.col}">${n}</div>
       <div class="big" style="color:${s.col}">${s.icon} ${s.type} STARTER</div>
       <p>The die picked the <b>${s.type.toLowerCase()}</b> starter (${s.faces}). Name it, then roll again for its lineage.</p>
     </div>
     <div class="catchhead" style="margin-top:14px"><div id="prev">${portrait({species:'?'},'lg')}</div>
       <div style="font-weight:800">Your ${s.type.toLowerCase()} starter</div></div>
     ${catchForm({spPlaceholder:'e.g. '+s.eg, level:'5', where:'Starter'})}
     <div class="acts"><button class="btn" onclick="toRoll()">🎲 Roll 2 of 2 — lineage</button></div>`;
  freezeCube(n);
  setTimeout(()=>{ const el = document.getElementById('spQ') || document.getElementById('fSpecies');
    if (el) el.focus(); }, 100);
}

/* ---------- commit a catch ---------- */
function commit(n){
  const held = inSlot(n);
  const nick = pending.nick;   // the tracker remembers the number; the name doesn't have to
  const ts = typesOf(pending.species);
  // Bloodline purity: a live dynasty turns away anyone who doesn't share its type, even
  // when the chair is free. It still keeps the number — it just never competes for it.
  const house = bloodOn() ? houseType(n) : null;
  const stray = !!house && ts.length > 0 && !ts.includes(house);
  const occupied = !!held || stray;

  const m = {
    id: S.seq++, species: pending.species.trim(), dex: dexOf(pending.species),
    nick, slot: n, level: pending.level, where: pending.where, nature: pending.nature,
    gender: pending.gender, ability: pending.ability, types: ts,
    shiny: !!pending.shiny,
    status: occupied ? 'boxed' : 'party', term: null,
    caughtAt: Date.now()
  };
  S.mons.push(m);
  // a hand-typed location becomes a real entry on the Routes tab
  if (m.where && !allAreas().includes(m.where) && !S.customAreas.includes(m.where))
    S.customAreas.push(m.where);
  if (!S.used.includes(pending.nick)) S.used.push(pending.nick);

  const tail = !occupied ? `Lineage ${n} was empty: <b>joins the party</b>.`
    : held ? `Lineage ${n} held by ${esc(held.nick)}, so <b>straight to the Box</b>.`
    : `Lineage ${n} is a ${esc(pretty(house))} dynasty and this isn't ${esc(pretty(house))} —
       <b>a Stray</b>, boxed and off the succession.`;
  logIt(m.shiny ? '✨' : '🎲',
    `Caught <b>${esc(nick)}</b> (${esc(pretty(m.species))})${m.shiny?' ✨':''}${m.where?` at ${esc(m.where)}`:''} — rolled <b>${n}</b>${m.gender?` ${GENDERS[m.gender][1]}`:''}${m.nature?`, ${esc(m.nature)} (${natureShort(m.nature)})`:''}${m.ability?`, ${esc(m.ability)}`:''}. ${tail}`);
  save(); render();

  const bench = lineage(n).filter(x=>x.status==='boxed').length;
  document.querySelector('.sheet').innerHTML =
    `${cubeHTML()}
     <div class="verdict ${occupied?'box':'party'}">
       <div class="big">ROLLED</div>
       <div class="rolled">${n}</div>
       <div style="display:flex;justify-content:center;margin:6px 0 2px">${portrait(m,'lg')}</div>
       ${monBadges(m,'lg')}
       ${(m.gender||m.ability)?`<p style="margin:2px 0 0;font-size:13.5px;color:var(--dim)">${m.gender?`${genderMark(m.gender)} ${GENDERS[m.gender][0]}`:''}${m.gender&&m.ability?' · ':''}${m.ability?esc(m.ability):''}</p>`:''}
       ${!occupied
         ? `<div class="big" style="color:var(--green)">✅ JOINS THE PARTY</div>
            <p><b>${esc(nick)}</b> takes the empty <b>lineage ${n}</b> chair.</p>`
         : held
         ? `<div class="big" style="color:var(--blue)">📦 STRAIGHT TO THE BOX</div>
            <p>Lineage ${n} is held by <b>${esc(held.nick)}</b>. <b>${esc(nick)}</b> joins the
            slot-${n} bench (<b>${bench} waiting</b>) until you rotate.</p>`
         : `<div class="big" style="color:var(--gold)">🧬 STRAY</div>
            <p>Lineage ${n} is a <b>${esc(pretty(house))}</b> dynasty. <b>${esc(nick)}</b> keeps the
            number but can never take the chair — it's boxed off the succession (Rule 33).</p>`}
     </div>
     ${m.nature?`<div style="margin-top:12px">${statStrip(m.nature)}</div>`:''}
     ${m.where ? '' : `<div class="acts"><button class="btn ghost" onclick="askWhere(${m.id})">
       📍 Add where you caught it</button></div>`}
     <div class="acts"><button class="btn" onclick="afterCatch(${m.id})">${
       !occupied && bloodOn() && !house ? '🧬 Found the lineage'
       : !occupied && tours() ? '📜 Roll its tour' : 'Got it'}</button></div>`;
  freezeCube(n);
  lockSheet(false);
}

/* =========================================================
   SWAP / DETAIL
   ========================================================= */
// Rule 29 polices the cap; this just records what the game already did, so it never refuses.
// Going over the cap surfaces as the usual warning card rather than a blocking dialog.
function bumpLevel(id, by){
  const m = mon(id);
  if (!m) return;
  const cur = parseInt(m.level, 10);
  const next = Math.min(100, Math.max(1, (isFinite(cur) ? cur : 0) + by));
  if (String(next) === String(m.level)) return;
  m.level = String(next);
  logIt('⬆️', `<b>${esc(m.nick)}</b> is now <b>Lv ${next}</b>.`);
  save(); render();
}
function askLevel(id){
  const m = mon(id);
  if (!m) return;
  const c = capNum();
  sheet(`<h3>${esc(m.nick)} — level</h3>
    ${S.levelCap && c ? `<p class="note" style="margin:0 0 10px">Cap is <b>Lv ${c}</b>${
      inGauntlet() ? ' but suspended — you\'re mid-gauntlet (Rule 37)' : ''}.</p>` : ''}
    <label for="lvIn">Level</label>
    <input type="number" id="lvIn" min="1" max="100" inputmode="numeric" value="${esc(m.level || '')}">
    <div class="acts">
      <button class="btn ghost" onclick="closeSheet()">Cancel</button>
      <button class="btn" onclick="setLevel(${id})">Save</button>
    </div>`);
  setTimeout(()=>{ const el = document.getElementById('lvIn'); if (el){ el.focus(); el.select(); } }, 120);
}
function setLevel(id){
  const m = mon(id);
  const v = (document.getElementById('lvIn') || {}).value;
  if (!m) return closeSheet();
  const lv = Math.min(100, Math.max(1, parseInt(v, 10) || 1));
  m.level = String(lv);
  logIt('⬆️', `<b>${esc(m.nick)}</b> set to <b>Lv ${lv}</b>.`);
  save(); render(); closeSheet();
}

// Evolving changes the species, and therefore the typing and the legal abilities. It never
// changes the Slot Number — nothing does (Rule 1).
function askEvolve(id){
  const m = mon(id);
  if (!m) return;
  const opts = evoTargets(m.species);
  if (!opts.length) return;
  if (opts.length === 1) return doEvolve(id, opts[0]);
  sheet(`<h3>${esc(m.nick)} evolves into…</h3>
    <p class="note" style="margin:0 0 12px">${esc(pretty(m.species))} has ${opts.length} branches.
      Pick whichever the game gave you.</p>
    ${opts.map(o => `<div class="row" onclick="doEvolve(${id},'${o.replace(/'/g,"\\'")}')">
      ${portrait({species:o, dex:dexOf(o)}, 'sm')}
      <div class="info"><div class="nick">${esc(pretty(o))}</div>
        <div class="meta">${typeBadges(typesOf(o)) || 'type not on file'}</div></div>
    </div>`).join('')}
    <div class="acts"><button class="btn ghost" onclick="closeSheet()">Cancel</button></div>`);
}
function doEvolve(id, to){
  const m = mon(id);
  if (!m) return closeSheet();
  const from = m.species;
  m.species = to;
  m.dex = dexOf(to);
  m.types = typesOf(to);
  logIt('✨', `<b>${esc(m.nick)}</b> evolved — ${esc(pretty(from))} → <b>${esc(pretty(to))}</b>.
    Lineage ${m.slot} unchanged (Rule 1).`);
  // Evolving can take a chair-holder outside its own dynasty's type. It keeps the chair —
  // growing up can't evict you — but the dynasty's type is what future heirs are judged on.
  if (bloodOn() && houseType(m.slot) && !monTypes(m).includes(houseType(m.slot)))
    logIt('🧬', `Heads up: lineage ${m.slot} is a <b>${esc(pretty(houseType(m.slot)))}</b> dynasty and
      <b>${esc(m.nick)}</b> no longer shares that type. It keeps the chair, but heirs are still
      judged on ${esc(pretty(houseType(m.slot)))} (Rule 33).`);
  if (m.ability)
    logIt('💡', `Check <b>${esc(m.nick)}</b>'s ability — ${esc(pretty(to))} may not have
      ${esc(m.ability)}. Tap the card to edit.`);
  save(); render(); closeSheet();
}

function swapIn(id){
  const m = mon(id);
  if (!m || m.status === 'party' || m.status === 'fallen') return;
  if (!pureFor(m)){
    alert(`${m.nick} doesn't share lineage ${m.slot}'s ${pretty(houseType(m.slot))} type, so it's
a Stray — it keeps the number but never takes the chair (Rule 33).`);
    return;
  }
  const out = inSlot(m.slot);
  if (out){ out.status = 'boxed'; out.winded = false; out.term = null; }   // its tour is over
  m.term = null;                                            // the newcomer rolls a fresh one
  m.status = 'party';
  logIt('⇄', out
    ? `Lineage <b>${m.slot}</b> rotation: <b>${esc(m.nick)}</b> in, <b>${esc(out.nick)}</b> to the Box.`
    : `Lineage <b>${m.slot}</b> filled: <b>${esc(m.nick)}</b> fielded.`);
  save(); render();
  if (bloodOn() && !houseType(m.slot)) askHouseType(m);
}

function openDetail(id){
  const m = mon(id);
  if (!m) return;
  const bench = lineage(m.slot).filter(x=>x.status==='boxed' && x.id!==id);
  sheet(`<div class="catchhead">${portrait(m,'lg')}<h3 style="margin:0">${esc(m.nick)}</h3></div>
    <div class="detail"><dl>
      <dt>Species</dt><dd>${esc(pretty(m.species))}${m.dex?` <span style="color:var(--dim)">#${m.dex}</span>`:''}</dd>
      <dt>Type</dt><dd>${monTypes(m).length ? monBadges(m)
        : '<span style="color:var(--dim)">not on file</span>'}${(()=>{ const nt = typeEraNote(m.species);
        return nt ? `<div class="note" style="margin:4px 0 0">${nt}</div>` : ''; })()}</dd>
      <dt>Lineage</dt><dd><b style="color:var(--gold)">${m.slot}</b> · ${lineage(m.slot).length} caught, ${bench.length} benched</dd>
      ${tours() && m.status==='party' ? `<dt>Tour</dt><dd>${
        m.winded ? '<span style="color:var(--gold)">ended early — Winded</span>'
        : m.term === 0 ? '<span style="color:var(--gold)">up — hands over at the next PC</span>'
        : m.term == null ? '<span style="color:var(--dim)">not rolled yet</span>'
        : `<b>${m.term}</b> major${m.term===1?'':'s'} left`}</dd>` : ''}
      <dt>Status</dt><dd>${m.status==='party'
        ? '<span style="color:var(--green)">In party</span>'
        : '<span style="color:var(--blue)">Boxed</span>'}</dd>
      <dt>Level</dt><dd>${m.level?('Lv '+esc(m.level)):'—'}</dd>
      <dt>Gender</dt><dd>${GENDERS[m.gender]
        ? genderMark(m.gender)+' '+GENDERS[m.gender][0]
        : '<span style="color:var(--dim)">not recorded</span>'}</dd>
      <dt>Ability</dt><dd>${m.ability ? esc(m.ability)
        : '<span style="color:var(--dim)">not recorded</span>'}</dd>
      <dt>Nature</dt><dd>${m.nature
        ? esc(m.nature)+' <span style="color:var(--dim)">'+natureShort(m.nature)+'</span>'
        : '<span style="color:var(--dim)">not recorded</span>'}</dd>
      <dt>Caught</dt><dd>${m.where ? esc(m.where)+' · '
        : '<span style="color:var(--gold)">location not set</span> · '}${
        new Date(m.caughtAt).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}</dd>
    </dl></div>
    <label for="eNick">Nickname</label>
    <input type="text" id="eNick" value="${esc(m.nick)}">
    <div class="two">
      <div><label for="eSpecies">Species (evolved?)</label>
        <input type="text" id="eSpecies" list="dexlist" value="${esc(m.species)}" oninput="refreshAbility()"></div>
      <div><label for="eLvl">Level</label>
        <input type="number" id="eLvl" min="1" max="100" inputmode="numeric" value="${esc(m.level)}"></div>
    </div>
    <div class="two">
      <div><label for="fGender">Gender</label>
        <select id="fGender">
          <option value="" ${!m.gender?'selected':''}>Unknown</option>
          <option value="m" ${m.gender==='m'?'selected':''}>♂ Male</option>
          <option value="f" ${m.gender==='f'?'selected':''}>♀ Female</option>
          <option value="n" ${m.gender==='n'?'selected':''}>Genderless</option>
        </select></div>
      <div><label for="fAbility">Ability</label>
        <div id="abilBox">${abilityField(m.dex||dexOf(m.species), m.ability||'')}</div></div>
    </div>
    <label for="eNature">Nature</label>
    <select id="eNature" onchange="document.getElementById('natEdit').innerHTML=statStrip(this.value)||''">
      ${natureOptions(m.nature||'')}</select>
    <div id="natEdit">${statStrip(m.nature)}</div>
    <label for="fWhere">Caught at</label>
    ${whereField(m.where || '')}
    <p class="note">Lineage ${m.slot} is permanent — it survives evolution, boxing and levelling.
      Nothing in Lineagelock changes a Pokémon's number (Rule 1). Battle order stays free (Rule 11) —
      it just moves too often to be worth tracking here.</p>
    <div class="acts">
      <button class="btn ghost" onclick="closeSheet()">Close</button>
      <button class="btn" onclick="saveEdit(${id})">Save</button>
    </div>
    ${m.status==='boxed'
      ? `<div class="acts"><button class="btn ghost" onclick="swapIn(${id});closeSheet()">
          ${inSlot(m.slot)?`⇄ Rotate into lineage ${m.slot}`:`↑ Field in lineage ${m.slot}`}</button></div>` : ''}
    <div class="acts"><button class="btn ghost" onclick="benchList(${m.slot})">
        📜 Lineage ${m.slot} history (${lineage(m.slot).length} total${
          bench.length?`, ${bench.length} benched`:''})</button></div>
    ${isPD() && m.status!=='fallen'
      ? `<div class="acts"><button class="btn danger" onclick="markFallen(${id})">
          💀 It fainted — mark as Fallen</button></div>` : ''}
    ${m.status==='fallen'
      ? `<p class="note" style="color:var(--red)">Fallen${m.fellAt?' on '+new Date(m.fellAt)
          .toLocaleDateString(undefined,{month:'short',day:'numeric'}):''} — out of the run for good (Rule 10).</p>` : ''}
    <div class="acts"><button class="btn danger" onclick="del(${id})">Delete entry (typo fix)</button></div>`);
}

function saveEdit(id){
  const m = mon(id);
  const nick = document.getElementById('eNick').value.trim();
  const sp = document.getElementById('eSpecies').value.trim();
  const lv = document.getElementById('eLvl').value.trim();
  if (sp && norm(sp) !== norm(m.species))
    logIt('✨', `<b>${esc(m.nick)}</b> is now a <b>${esc(pretty(sp))}</b> — keeps lineage <b>${m.slot}</b>.`);
  if (nick) m.nick = nick;
  if (sp){ m.species = sp; m.dex = dexOf(sp); }
  m.level = lv;
  const g = document.getElementById('fGender').value;
  if (g !== (m.gender||'')) m.gender = g;
  const ab = readAbility();
  if (ab !== (m.ability||'')){
    m.ability = ab;
    if (ab) logIt('🧠', `<b>${esc(m.nick)}</b>'s ability recorded: <b>${esc(ab)}</b>.`);
  }
  const nat = document.getElementById('eNature').value;
  if (nat !== (m.nature||'')){
    m.nature = nat;
    if (nat) logIt('🧬', `<b>${esc(m.nick)}</b> is <b>${esc(nat)}</b> — ${
      NATURES[nat] ? `+10% ${STATS[NATURES[nat][0]]}, −10% ${STATS[NATURES[nat][1]]}` : 'no stat effect'}.`);
  }
  setWhere(m, readWhere());
  save(); render(); closeSheet();
}

// One place to record a location, so the Routes tab and the custom-area list stay in step
// however it was set — from the catch form, the verdict screen or the detail sheet.
function setWhere(m, where){
  const w = (where || '').trim();
  if (w === (m.where || '')) return false;
  const was = m.where;
  m.where = w;
  if (w && !allAreas().includes(w) && !S.customAreas.includes(w)) S.customAreas.push(w);
  logIt('📍', was
    ? `<b>${esc(m.nick)}</b> was caught at <b>${esc(w || '—')}</b>, not ${esc(was)}.`
    : `<b>${esc(m.nick)}</b> logged as caught at <b>${esc(w)}</b>.`);
  return true;
}
// Offered straight after the roll, when you notice the location is blank.
function askWhere(id){
  const m = mon(id);
  if (!m) return;
  sheet(`<h3>📍 Where did you catch ${esc(m.nick)}?</h3>
    <p class="note" style="margin:0 0 10px">${oneEach()
      ? 'This ticks the location on the Routes tab and is how the tracker knows the area is spent (Rule 18).'
      : 'Recorded on the Routes tab so you can see where you have been.'}</p>
    ${whereField(m.where || S.lastArea || '')}
    <div class="acts">
      <button class="btn ghost" onclick="closeSheet()">Skip</button>
      <button class="btn" onclick="saveWhere(${id})">Save</button>
    </div>`);
}
function saveWhere(id){
  const m = mon(id);
  if (!m) return closeSheet();
  const w = readWhere();
  if (setWhere(m, w) && w) S.lastArea = w;
  save(); render(); closeSheet();
}

// Full history for one number — every Pokémon the die ever assigned to it, oldest first.
function benchList(n){
  const all = lineage(n).slice().sort((a,b)=>a.caughtAt-b.caughtAt);
  const cur = inSlot(n);
  sheet(`<h3>Lineage ${n} — history</h3>
    <p class="note" style="margin:0 0 12px">${all.length} Pokémon ${all.length===1?'has':'have'} carried the number <b>${n}</b>.
      Currently fielding <b style="color:var(--txt)">${cur?esc(cur.nick):'nobody'}</b>.
      Only lineage-${n} Pokémon can ever take this chair.</p>
    ${all.length ? all.map((m,i)=>`<div class="row">
        <div class="lin">${i+1}</div>
        ${portrait(m,'sm')}
        <div class="info" onclick="openDetail(${m.id})">
          <div class="nick">${esc(m.nick)} ${m.status==='party'
            ? '<span style="color:var(--green);font-size:11px;font-weight:800"> IN PARTY</span>'
            : m.status==='fallen'
            ? '<span style="color:var(--red);font-size:11px;font-weight:800"> FALLEN</span>'
            : '<span style="color:var(--blue);font-size:11px;font-weight:800"> BOXED</span>'}</div>
          <div class="meta">${esc(pretty(m.species))}${m.level?` · Lv ${m.level}`:''}${
            m.where?` · ${esc(m.where)}`:''}</div>
        </div>
        ${m.status==='boxed'?`<button class="sw" onclick="swapIn(${m.id});closeSheet()">${
          cur?'⇄':'↑'}</button>`:''}
      </div>`).join('') : '<div class="empty">Nothing has rolled this number yet.</div>'}
    <div class="acts"><button class="btn ghost" onclick="closeSheet()">Close</button></div>`);
}

function del(id){
  const m = mon(id);
  if (!confirm(`Delete ${m.nick} entirely? Use this only for typos — Lineagelock never releases anyone.`)) return;
  S.mons = S.mons.filter(x=>x.id!==id);
  logIt('🗑️', `Deleted entry <b>${esc(m.nick)}</b> (lineage ${m.slot}).`);
  save(); render(); closeSheet();
}

function resetRun(){
  if (!confirm(`Wipe "${S.name}" and start it over? This cannot be undone.`)) return;
  // clear in place so the run keeps its identity inside the registry
  const fresh = blankRun(S.name, S);
  for (const k of Object.keys(fresh)) if (k !== 'id' && k !== 'created') S[k] = fresh[k];
  save(); tab='party'; render(); closeSheet();
}

/* =========================================================
   WIRING
   ========================================================= */
document.getElementById('dexlist').innerHTML =
  DEX.map((n,i)=>`<option value="${pretty(n)}">#${i+1}</option>`).join('');
document.getElementById('abillist').innerHTML =
  ABIL.a.map(a=>`<option value="${a}"></option>`).join('');
const fab = document.getElementById('catchBtn');
function paintFab(){
  const wheel = S.encMode === 'wheel' && hasEncData();
  fab.innerHTML = wheel ? '🎡 Spin for an encounter' : BALL(23) + ' Catch a Pok\u00e9mon';
  fab.onclick = wheel ? openWheel : () => openCatch();
}
paintFab();
document.querySelectorAll('nav button').forEach(b=>
  b.onclick = ()=>{ tab = b.dataset.tab; render(); });
document.getElementById('reset').onclick = e=>{ e.preventDefault(); resetRun(); };
document.addEventListener('keydown', e=>{
  if (e.key==='Escape') closeSheet();
  if (e.key==='Enter' && document.getElementById('fSpecies') && document.activeElement.id!=='fNick') toRoll();
});
render();
</script>
</body>
</html>
