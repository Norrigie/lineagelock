<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>🎲 Lineagelock Tracker</title>
<style>
  :root{
    --bg:#0e1117; --bg2:#151a23; --card:#1b212c; --card2:#222a37; --line:#2c3542;
    --txt:#e8edf5; --dim:#8e9bad; --gold:#ffc94a; --red:#e8503a; --green:#3ecf8e;
    --blue:#5aa9ff; --purple:#b07bff; --r:14px; --tap:56px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:radial-gradient(1000px 600px at 50% -10%, #1d2634 0%, transparent 60%), var(--bg);
    color:var(--txt);
    font:16px/1.5 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    padding:0 0 120px; min-height:100vh;
  }
  .wrap{max-width:720px;margin:0 auto;padding:0 16px}

  header{position:sticky;top:0;z-index:40;background:rgba(14,17,23,.88);
    backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:14px 0 10px}
  .brand{display:flex;align-items:center;gap:10px}
  .brand h1{font-size:20px;margin:0;letter-spacing:.3px}
  .brand .sub{font-size:12px;color:var(--dim);margin-top:1px}
  .brand .logo{font-size:26px;filter:drop-shadow(0 2px 6px rgba(255,201,74,.35))}
  .cog{margin-left:auto;background:none;border:1px solid var(--line);color:var(--dim);
    width:42px;height:42px;border-radius:11px;font-size:17px;cursor:pointer;flex:0 0 auto}
  .stats{text-align:right;font-size:12px;color:var(--dim);line-height:1.35}
  .stats b{color:var(--gold);font-size:15px}

  nav{display:flex;gap:8px;margin-top:12px}
  nav button{flex:1;min-width:0;min-height:44px;border:1px solid var(--line);background:var(--bg2);
    color:var(--dim);border-radius:11px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;
    white-space:nowrap;overflow:hidden}
  @media(max-width:460px){nav{gap:4px}nav button{font-size:11px;padding:0 1px;letter-spacing:-.2px}
    nav button .n{margin-left:2px;padding:0 3px;font-size:9.5px;min-width:13px}}
  nav button.on{background:var(--card2);color:var(--txt);border-color:#3d4a5c}
  nav button .n{display:inline-block;min-width:20px;margin-left:5px;padding:0 5px;
    background:var(--line);border-radius:20px;font-size:11px;color:var(--dim)}
  nav button.on .n{background:var(--gold);color:#1a1206}

  h2.sec{font-size:13px;text-transform:uppercase;letter-spacing:1.4px;color:var(--dim);
    margin:22px 0 10px;display:flex;align-items:center;gap:8px}
  h2.sec .tip{text-transform:none;letter-spacing:0;font-weight:400;font-size:12px;color:#66738a}
  .btn{min-height:var(--tap);width:100%;border:none;border-radius:var(--r);
    font:800 17px/1 inherit;color:#1a1206;background:var(--gold);cursor:pointer;
    transition:transform .1s;display:flex;align-items:center;justify-content:center;gap:8px}
  .btn:active{transform:scale(.98)}
  .btn.ghost{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
  .btn.danger{background:transparent;color:var(--red);border:1px solid #4a2a25}
  .empty{text-align:center;color:var(--dim);padding:40px 20px;font-size:15px;
    border:1px dashed var(--line);border-radius:var(--r)}
  .empty .big{font-size:34px;display:block;margin-bottom:8px;opacity:.6}

  /* portraits */
  .por{width:46px;height:46px;flex:0 0 auto;border-radius:10px;background:var(--card2);
    display:grid;place-items:center;overflow:hidden;position:relative;border:1px solid var(--line)}
  .por img{width:46px;height:46px;image-rendering:pixelated;display:block}
  .por .mono{position:absolute;font-weight:900;font-size:18px;color:#5b6879}
  .por.sm,.por.sm img{width:34px;height:34px}
  .por.lg,.por.lg img{width:64px;height:64px}
  .por.lg{border-radius:14px}

  /* lineage grid */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:430px){.grid{grid-template-columns:1fr}}
  .slot{position:relative;background:var(--card);border:1px solid var(--line);
    border-radius:var(--r);padding:12px;min-height:76px;display:flex;align-items:center;gap:11px;
    cursor:pointer;overflow:hidden}
  .slot:active{background:var(--card2)}
  .slot.vacant{background:transparent;border-style:dashed;cursor:default}
  .slot .num{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
    font-weight:900;font-size:17px;background:var(--card2);color:var(--dim);
    border:1px solid var(--line);flex:0 0 auto}
  .slot.filled .num{background:var(--gold);color:#1a1206;border-color:transparent}
  .slot .body{min-width:0;flex:1}
  .slot .nick{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .slot .meta{font-size:12.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* Nature and ability get their own row so neither is ever the bit that gets truncated.
     It wraps rather than clipping, because both are things you check mid-battle. */
  .slot .attrs{display:flex;flex-wrap:wrap;gap:3px 8px;margin-top:3px;
    font-size:12px;line-height:1.3;padding-right:46px}
  /* Level and evolve, on the card, because you do these constantly mid-route. */
  .slot .quick{display:flex;gap:6px;margin-top:8px;padding-right:46px;flex-wrap:wrap}
  .slot .quick button{background:var(--card2);border:1px solid var(--line);color:var(--txt);
    border-radius:8px;font:inherit;font-size:12px;font-weight:800;padding:4px 10px;cursor:pointer}
  .slot .quick button:active{background:var(--line)}
  .slot .quick button.evo{color:var(--gold);border-color:#4a3c18}
  .slot .attrs span{color:var(--txt)}
  .slot .attrs i{font-style:normal;color:var(--dim)}
  .slot .attrs em{font-style:normal;color:var(--gold)}
  .slot .vac{color:var(--dim);font-size:14px;font-weight:700}
  .chip{position:absolute;right:9px;top:9px;font-size:10.5px;font-weight:800;
    border-radius:20px;padding:2px 7px}
  /* Type badges, matching pokemondb.net: squared 4px corners, uppercase, white text
     with a soft drop shadow so the lighter types stay readable. */
  .types{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
  .slot .types{padding-right:46px}          /* clears the bench-depth chip */
  .slot{padding-bottom:14px}
  .tbadge{display:inline-block;min-width:58px;padding:1px 7px;border-radius:4px;
    font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
    color:#fff;text-align:center;line-height:16px;
    text-shadow:1px 1px 2px rgba(0,0,0,.7)}
  .tbadge.lg{min-width:66px;font-size:12px;line-height:24px;padding:0 10px}
  .types.big{gap:6px;margin-top:8px;justify-content:center}
  .chip.depth{color:var(--purple);background:#251c3a;top:auto;bottom:9px}
  .statgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .statgrid>div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .statgrid b{display:block;font-size:22px;color:var(--gold);line-height:1.15}
  .statgrid span{font-size:11.5px;color:var(--dim)}
  .pips{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
  .pipbtn{min-height:48px;border-radius:11px;border:1px solid var(--line);background:var(--card2);
    color:var(--txt);font:800 17px/1 inherit;cursor:pointer}
  .pipbtn:active{background:var(--gold);color:#1a1206}

  /* next-up banner */
  .nextup{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
    border-left:3px solid var(--gold);border-radius:12px;padding:10px 12px;margin:16px 0 0;cursor:pointer}
  .nextup:active{background:var(--card2)}
  .nextup.warn{border-left-color:var(--red)}
  .nextup .nlabel{font-size:9.5px;font-weight:900;letter-spacing:1.2px;color:var(--dim);
    writing-mode:vertical-rl;transform:rotate(180deg)}
  .nextup .nname{flex:1;min-width:0;font-weight:800;font-size:15.5px}
  .nextup .nname span{display:block;font-weight:600;font-size:12.5px;color:var(--dim)}
  .nextup .ngo{color:var(--dim);font-size:20px}
  /* Beat the next wall without leaving this tab. */
  .nextup .beat{background:var(--gold);color:#1a1206;border:0;border-radius:9px;font:inherit;
    font-size:12.5px;font-weight:900;padding:7px 12px;cursor:pointer;white-space:nowrap}
  .nextup .beat:active{filter:brightness(.9)}
  .nextup .beat.locked{background:var(--card2);color:var(--dim)}
  .chip.term{color:#9fd0ff;background:#152b44;top:auto;bottom:9px;right:auto;left:9px}
  .chip.roll{color:#ffd479;background:#3a2e14;top:auto;bottom:9px;right:auto;left:9px}
  .nextup.roll{border-left-color:#ffd479}
  .chip.wind{color:#ffd479;background:#3a2e14;top:auto;bottom:9px;right:auto;left:9px}
  .wtick{font-size:18px;width:24px;text-align:center}

  /* run switcher */
  .runswitch{cursor:pointer}
  .runrow{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:9px 10px;margin-bottom:8px}
  .runrow.on{border-color:var(--gold);background:#241f14}
  .runmain{flex:1;min-width:0;cursor:pointer}
  .runname{font-weight:800;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nowtag{font-size:10px;color:var(--gold);letter-spacing:1px;font-weight:900}
  .runmeta{font-size:12.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .runbtn{width:42px;height:42px;flex:0 0 auto;border-radius:10px;border:1px solid var(--line);
    background:var(--bg2);font-size:15px;cursor:pointer}
  .runbtn:active{background:var(--card2)}

  /* two-frame icon sheets (fan-game art) — class must not collide with .sheet (modals) */
  .por.iconsheet{background-size:200% 100%;background-position:left center;background-repeat:no-repeat;
    image-rendering:pixelated}
  .splist{max-height:38vh;overflow-y:auto;margin-top:8px;border-radius:12px}
  .splist:empty{display:none}
  .sprow{display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:10px;cursor:pointer;
    border:1px solid transparent}
  .sprow:active{background:var(--card2)}
  .sprow.on{border-color:var(--gold);background:#241f14}
  .sprow span{font-weight:700;font-size:15px}

  /* encounter wheel */
  .wheelwrap{position:relative;display:grid;place-items:center;margin:10px 0 4px}
  .wheel{width:min(78vw,240px);height:min(78vw,240px);filter:drop-shadow(0 6px 18px rgba(0,0,0,.5))}
  .wheelwrap .ptr{position:absolute;top:-6px;z-index:2;font-size:22px;color:var(--gold);
    text-shadow:0 2px 4px #000}
  #wheelG{transform-origin:50% 50%}

  /* run setup steps */
  .setup{display:flex;flex-direction:column;gap:8px}
  .step{display:flex;align-items:center;gap:11px;background:var(--card);cursor:pointer;
    border:1px solid var(--line);border-radius:12px;padding:11px;min-height:56px}
  .step:active{background:var(--card2)}
  .step .tick{width:30px;height:30px;border-radius:9px;border:2px solid var(--line);flex:0 0 auto;
    display:grid;place-items:center;font-weight:900;font-size:14px;color:var(--dim)}
  .step.done .tick{background:var(--green);border-color:var(--green);color:#1a1206}

  /* mode cards */
  .modecard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    padding:14px;margin-bottom:10px;cursor:pointer}
  .modecard:active{background:var(--card2)}
  .modecard.on{border-color:var(--gold);background:#241f14}
  .modecard .mhead{font-weight:900;font-size:17px;display:flex;justify-content:space-between;align-items:center}
  .modecard .mhead span{font-size:10.5px;color:var(--gold);letter-spacing:1px}
  .modecard .mbody{font-size:13.5px;color:var(--dim);margin-top:5px}
  .fallenrow{opacity:.5}
  .fallenrow .nick{text-decoration:line-through}

  /* nature */
  .statrow{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 0}
  .st{font-size:11.5px;font-weight:800;border-radius:9px;padding:5px 8px;background:var(--card2);
    color:#6f7c8f;border:1px solid var(--line);white-space:nowrap}
  .st.up{color:var(--green);border-color:#2b4a3c;background:#16302a}
  .st.down{color:var(--red);border-color:#4a2a25;background:#301a16}

  /* major battles */
  .prog{display:flex;align-items:center;gap:11px;margin:0 0 12px}
  .prog .bar{flex:1;height:10px;border-radius:20px;background:var(--card2);overflow:hidden;
    border:1px solid var(--line)}
  .prog .bar span{display:block;height:100%;background:linear-gradient(90deg,#ffc94a,#3ecf8e);
    border-radius:20px;transition:width .35s}
  .prog .pnum{font-weight:900;font-size:14px;color:var(--gold);flex:0 0 auto}
  .bat{display:flex;align-items:center;gap:11px;background:var(--card);cursor:pointer;
    border:1px solid var(--line);border-radius:12px;padding:11px;margin-bottom:8px;min-height:56px}
  .bat:active{background:var(--card2)}
  .bat .tick{width:30px;height:30px;border-radius:9px;border:2px solid var(--line);flex:0 0 auto;
    display:grid;place-items:center;font-weight:900;color:#1a1206;font-size:16px}
  .bat.done{opacity:.55}
  .bat.done .tick{background:var(--green);border-color:var(--green)}
  .bat.done .bname{text-decoration:line-through}
  .binfo{flex:1;min-width:0}
  .bname{font-weight:800;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bmeta{font-size:12.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kind{font-size:10.5px;font-weight:800;border:1px solid;border-radius:20px;padding:3px 8px;flex:0 0 auto}

  .bat.burned{opacity:.75}
  .bat.burned .tick{background:#301a16;border-color:#4a2a25}
  .bat.burned .bname{color:var(--red)}

  /* box rows */
  .grouphead{display:flex;align-items:center;gap:9px;margin:18px 0 8px}
  .grouphead .pill{width:28px;height:28px;border-radius:8px;background:var(--card2);
    display:grid;place-items:center;font-weight:900;font-size:14px;color:var(--gold);border:1px solid var(--line)}
  .grouphead span{font-size:13px;color:var(--dim);font-weight:700;letter-spacing:.5px}
  .row{display:flex;align-items:center;gap:11px;background:var(--card);
    border:1px solid var(--line);border-radius:var(--r);padding:10px 11px;margin-bottom:8px}
  .row .info{flex:1;min-width:0;cursor:pointer}
  .row .nick{font-weight:800;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .meta{font-size:12.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .sw{min-height:44px;padding:0 13px;border-radius:11px;border:1px solid #2b4a3c;
    background:#16302a;color:var(--green);font:800 14px/1 inherit;cursor:pointer;flex:0 0 auto}
  .row .lin{width:30px;height:30px;border-radius:8px;background:var(--card2);color:var(--gold);
    display:grid;place-items:center;font-weight:900;flex:0 0 auto;border:1px solid var(--line)}
  .sortbar{display:flex;gap:8px;margin-bottom:4px}
  .sortbar button{flex:1;min-height:40px;border-radius:10px;border:1px solid var(--line);
    background:var(--bg2);color:var(--dim);font:700 13px/1 inherit;cursor:pointer}
  .sortbar button.on{background:var(--card2);color:var(--txt)}

  .logitem{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
  .logitem .ico{width:32px;height:32px;flex:0 0 auto;border-radius:9px;display:grid;
    place-items:center;background:var(--card2);font-size:15px}
  .logitem .t{flex:1;min-width:0}
  .logitem .when{font-size:11.5px;color:var(--dim);margin-top:2px}

  .scrim{position:fixed;inset:0;background:rgba(6,8,12,.72);backdrop-filter:blur(4px);
    z-index:90;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}
  @media(min-width:560px){.scrim{align-items:center}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .sheet{width:100%;max-width:520px;background:var(--bg2);border:1px solid var(--line);
    border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));
    max-height:92vh;overflow:auto;animation:up .22s cubic-bezier(.2,.9,.2,1)}
  @media(min-width:560px){.sheet{border-radius:20px}}
  @keyframes up{from{transform:translateY(22px);opacity:.4}to{transform:none;opacity:1}}
  .sheet h3{margin:2px 0 14px;font-size:20px}
  label{display:block;font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;
    color:var(--dim);margin:14px 0 6px}
  input[type=text],input[type=number],select{width:100%;min-height:52px;background:var(--card);
    border:1px solid var(--line);border-radius:12px;color:var(--txt);font:16px inherit;padding:0 14px}
  select{appearance:none;cursor:pointer}
  input:focus,select:focus{outline:none;border-color:var(--gold)}
  .two{display:flex;gap:10px}
  .two>div{flex:1}
  .inline{display:flex;gap:8px;align-items:stretch}
  .inline input{flex:1}
  .inline button{min-width:58px;border-radius:12px;border:1px solid var(--line);
    background:var(--card2);color:var(--txt);font-size:19px;cursor:pointer;flex:0 0 auto}
  .inline button:active{background:var(--line)}
  .check{display:flex;align-items:center;gap:10px;margin-top:14px;cursor:pointer;color:var(--dim);font-size:14px}
  .check input{width:22px;height:22px;accent-color:var(--gold)}
  .acts{display:flex;gap:10px;margin-top:18px}
  .acts .btn{flex:1}
  .note{color:#66738a;font-size:12px;margin:10px 0 0;line-height:1.45}
  .note a{color:var(--blue)}
  .catchhead{display:flex;align-items:center;gap:12px;margin-bottom:2px}

  /* dice */
  .stage{height:200px;display:grid;place-items:center;perspective:900px;margin:4px 0}
  .cube{width:96px;height:96px;position:relative;transform-style:preserve-3d;
    transform:rotateX(-20deg) rotateY(24deg)}
  .cube.rolling{transition:transform 1.55s cubic-bezier(.16,.72,.16,1)}
  .face{position:absolute;inset:0;border-radius:14px;
    background:linear-gradient(148deg,#fffdf6,#e6e2d4);border:1px solid #cfcabb;
    box-shadow:inset 0 0 14px rgba(0,0,0,.13);display:grid;
    grid-template:repeat(3,1fr)/repeat(3,1fr);padding:11px;gap:3px}
  .pip{width:16px;height:16px;border-radius:50%;background:#20242c;
    box-shadow:inset 0 -2px 3px rgba(255,255,255,.22);place-self:center}
  .pip.r{background:var(--red)}
  .f1{transform:translateZ(48px)}
  .f6{transform:rotateY(180deg) translateZ(48px)}
  .f2{transform:rotateY(90deg) translateZ(48px)}
  .f5{transform:rotateY(-90deg) translateZ(48px)}
  .f3{transform:rotateX(90deg) translateZ(48px)}
  .f4{transform:rotateX(-90deg) translateZ(48px)}
  .shadow{width:86px;height:14px;border-radius:50%;background:rgba(0,0,0,.5);
    filter:blur(7px);margin-top:-14px;transition:.4s}
  .hint{text-align:center;color:var(--dim);font-size:14px;min-height:22px}
  .verdict{text-align:center;padding:2px 0}
  .verdict .big{font-size:15px;font-weight:800;letter-spacing:.4px}
  .verdict .rolled{font-size:44px;font-weight:900;line-height:1.1;margin:2px 0 6px}
  .verdict.party .rolled{color:var(--green)}
  .verdict.box .rolled{color:var(--blue)}
  .verdict p{margin:6px 0 0;font-size:14.5px;color:var(--dim)}
  .verdict p b{color:var(--txt)}
  .detail dl{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:0}
  .detail dt{color:var(--dim);font-size:13px;font-weight:700}
  .detail dd{margin:0;font-size:15px}

  footer{text-align:center;color:#5c6879;font-size:12px;padding:26px 0 0;line-height:1.7}
  footer a{color:#5c6879}
  /* Tip link: legible, but quieter than anything that affects the run. */
  .kofi{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:5px 12px;
    border:1px solid var(--line);border-radius:99px;color:var(--dim);text-decoration:none;
    font-size:12px;font-weight:700}
  .kofi:hover{color:var(--gold);border-color:var(--gold)}
  .fabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    background:linear-gradient(transparent,rgba(14,17,23,.96) 42%);
    display:flex;justify-content:center;pointer-events:none}
  .fabbar .btn{max-width:688px;pointer-events:auto;box-shadow:0 8px 26px rgba(0,0,0,.5)}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="brand">
      <div class="logo">🎲</div>
      <div>
        <h1>Lineagelock</h1>

const isDecay = () => S.game === 'decay';
function decaySprite(species){ return isDecay() ? (dspr()[norm(species)] || null) : null; }

// Decay ships its own icons and they aren't ours to redistribute, so a public copy has no
// decay-sprites.js at all. Only a Decay run wants it, so only a Decay run asks for it — that
// way nobody else's console collects a 404 for a file that was never meant to be there.
// Generate it from your own install with tools/build-decay-sprites.mjs.
let packTried = false;
function loadDecayPack(){
  if (packTried || !isDecay() || window.DECAY_SPRITES) return;
  packTried = true;
  const s = document.createElement('script');
  s.src = 'decay-sprites.js';
  s.onload  = () => render();          // portraits were drawn as monograms; redraw them
  s.onerror = () => s.remove();        // not there: letter placeholders, nothing else changes
  document.head.appendChild(s);
}

  .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .replace(/[^a-z0-9]/g,'');
const DEXBY = {};
DEX.forEach((n,i)=>{ DEXBY[norm(n)] = i+1; });

// purely the fallback for an unknown species or an image that fails to load.
function portrait(m, cls){
  const d = m.dex || dexOf(m.species);
  const initial = esc((m.species||'?').charAt(0).toUpperCase());
  const mono = `<span class=\\'mono\\'>${initial}</span>`;
  const ds = decaySprite(m.species);           // the fan game's own icon, when playing it
  if (ds) return `<div class="por iconsheet ${cls||''}" style="background-image:url(${ds})"></div>`;
  return `<div class="por ${cls||''}">${
    d ? `<img src="${PORTRAIT(d)}" alt="" loading="lazy"
           onerror="this.parentNode.innerHTML='${mono}'">`
      : `<span class="mono">${initial}</span>`}</div>`;
}

/* ---------- gender & ability ---------- */
function genderMark(g){
  const e = GENDERS[g];
  if (!e) return '';
  return `<span title="${e[0]}" style="color:${e[2]};font-weight:900">${e[1]}</span>`;
}
// The abilities a species can legally have, hidden ones flagged.
function abilitiesFor(dex){
  const list = ABIL.m[dex];
  if (!list) return [];
  return list.map(x=>{
    const hidden = typeof x === 'string';
    return { name: ABIL.a[parseInt(x,10)], hidden };
  });
}
function abilityField(dex, cur){
  const opts = abilitiesFor(dex);
  if (!opts.length)
    return `<input type="text" id="fAbility" value="${esc(cur||'')}"
      placeholder="type the ability" autocomplete="off" list="abillist">`;
  const known = opts.some(o=>o.name === cur);
  return `<select id="fAbility" onchange="abilityOther()">
      <option value="" ${!cur?'selected':''}>Unknown / not checked yet</option>
      ${opts.map(o=>`<option value="${esc(o.name)}" ${o.name===cur?'selected':''}>${
        esc(o.name)}${o.hidden?' — hidden':''}</option>`).join('')}
      <option value="__other" ${cur&&!known?'selected':''}>Other / not listed…</option>
    </select>
    <input type="text" id="fAbilityOther" value="${cur&&!known?esc(cur):''}" list="abillist"
      placeholder="ability name" autocomplete="off"
      style="margin-top:8px;display:${cur&&!known?'block':'none'}">`;
}
function abilityOther(){
  const sel = document.getElementById('fAbility');
  const other = document.getElementById('fAbilityOther');
  if (!sel || !other) return;
  other.style.display = sel.value === '__other' ? 'block' : 'none';
  if (sel.value === '__other') other.focus();
}
function readAbility(){
  const sel = document.getElementById('fAbility');
  if (!sel) return '';
  if (sel.tagName === 'INPUT') return sel.value.trim();
  if (sel.value === '__other') return (document.getElementById('fAbilityOther').value||'').trim();
  return sel.value;
}
// Species changed in the catch form -> re-offer that species' abilities.
function refreshAbility(){
  const box = document.getElementById('abilBox');
  if (!box) return;
  const spEl = document.getElementById('fSpecies') || document.getElementById('eSpecies');
  const keep = readAbility();
  box.innerHTML = abilityField(dexOf(spEl ? spEl.value : ''), keep);
}

/* ---------- natures ---------- */
// One-line summary, e.g. "+Atk / −SpA" — compact enough for a dropdown or a meta line.
function natureShort(nat){
  const e = NATURES[nat];
  if (e === undefined) return '';
  if (e === null) return 'neutral';
  return `+${SHORT[e[0]]} / −${SHORT[e[1]]}`;
}
// The full five-stat readout that shows what the nature actually does.
function statStrip(nat){
  const e = NATURES[nat];
  if (e === undefined)
    return `<p class="note" style="margin:8px 0 0">Nature not recorded — add it and the stat
      effect shows up here.</p>`;
  const pills = Object.keys(STATS).map(k=>{
    const up = e && e[0]===k, down = e && e[1]===k;
    return `<span class="st ${up?'up':down?'down':''}">${STATS[k]} ${
      up?'+10%':down?'−10%':'—'}</span>`;
  }).join('');
  const tail = e
    ? `<b style="color:var(--green)">${STATS[e[0]]}</b> grows 10% faster;
       <b style="color:var(--red)">${STATS[e[1]]}</b> 10% slower.
       Likes ${FLAVOR[e[0]]} food, dislikes ${FLAVOR[e[1]]}.`
    : `A neutral nature — no stat is raised or lowered, and no flavour is disliked.`;
  return `<div class="statrow">${pills}</div><p class="note" style="margin:8px 0 0">${tail}</p>`;
}
function natureOptions(sel){
  const groups = {'Neutral — no effect':[]};
  Object.keys(NATURES).forEach(n=>{
    const e = NATURES[n];
    const g = e===null ? 'Neutral — no effect' : `+ ${STATS[e[0]]}`;
    (groups[g] ||= []).push(n);
  });
  return `<option value="" ${!sel?'selected':''}>Unknown / not checked yet</option>` +
    Object.keys(groups).map(g=>`<optgroup label="${g}">${groups[g].map(n=>
      `<option value="${n}" ${n===sel?'selected':''}>${n}${
        NATURES[n]?` (${natureShort(n)})`:''}</option>`).join('')}</optgroup>`).join('');
}

function uid(){ return 'r' + Date.now().toString(36) + Math.floor(Math.random()*1e4).toString(36); }

function blankRun(name, seed){
  return { id:uid(), name:name || 'New run', created:Date.now(),
    mons:[], log:[], seq:1,
    theme:(seed && seed.theme) || 'sca-myth', apiKey:(seed && seed.apiKey) || '', used:[],
    game:null, beat:{}, custom:[], mode:null, encMode:null, lastArea:'',
    areas:{}, customAreas:[], levelCap:false, succession:'choose', cap:'',
    tourDie:6, blood:false, bloodType:{}, shinyClause:false, starter:'full',
    mlock:false, methods:{}, capOK:{}, capFix:{} };
}
function fixRun(d, i){
  d.id = d.id || uid();
  d.name = d.name || ('Run ' + ((i||0)+1));
  d.created = d.created || Date.now();
  d.mons = Array.isArray(d.mons) ? d.mons : [];
  d.log = Array.isArray(d.log) ? d.log : [];
  d.seq = d.seq || 1;
  d.theme = d.theme || 'sca-myth'; d.apiKey = d.apiKey || ''; d.used = d.used || [];
  d.game = d.game || null; d.beat = d.beat || {}; d.custom = d.custom || [];
  d.mode = d.mode || null; d.encMode = d.encMode || null; d.lastArea = d.lastArea || '';
  d.areas = d.areas || {}; d.customAreas = d.customAreas || [];
  d.levelCap = !!d.levelCap; d.succession = d.succession || 'choose'; d.cap = d.cap || '';
  d.tourDie = [4,6,8].includes(d.tourDie) ? d.tourDie : 6;
  d.blood = !!d.blood; d.bloodType = d.bloodType || {};
  d.shinyClause = !!d.shinyClause;
  d.starter = ['full','half','trad'].includes(d.starter) ? d.starter : 'full';
  d.mlock = !!d.mlock; d.methods = d.methods || {};
  d.capOK = d.capOK || {}; d.capFix = d.capFix || {};
  return d;
}

function loadDB(){
  // current format
  try{
    const db = JSON.parse(localStorage.getItem(KEY));
    if (db && Array.isArray(db.runs) && db.runs.length){
      db.runs = db.runs.map(fixRun);
      if (!db.runs.some(r=>r.id===db.active)) db.active = db.runs[0].id;
      return db;
    }
  }catch(e){}
  // migrate a single pre-multi-run save so nobody loses a run in progress
  try{
    const old = JSON.parse(localStorage.getItem(OLD_KEY));
    if (old && Array.isArray(old.mons)){
      const r = fixRun(old, 0);
      r.name = 'Imported run';
      return { active:r.id, runs:[r] };
    }
  }catch(e){}
  const r = blankRun('My first run');
  return { active:r.id, runs:[r] };
}
function activeRun(){
  return DB.runs.find(r=>r.id===DB.active) || DB.runs[0];
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(DB)); }
  catch(e){ alert('Could not save — browser storage is full. Delete an old run or clear imported sprites.'); }
}

/* ---------- the cap itself ---------- */
// The next major's ace level isn't in any dataset I could bundle, so you tell the
// tracker once per wall and it polices the rest.
// Rule 37: a run of majors you can't reach a Box between counts as one wall.
const isGaunt = b => b && (b[3] === 'e4' || b[3] === 'champ') && !isPost(b);
// Extras beyond the League block, by first and last battle name. Each one is a place the
// game marches you straight from one major into the next:
//   bw  — N's Castle rises the moment Alder falls; N and Ghetsis follow with no Centre.
//   sm  — Aether Paradise runs Guzma into Lusamine back to back.
// Deliberately absent: B2W2's Ghetsis, ORAS's Zinnia, SwSh's Rose and SV's Sada/Turo are all
// reached with a PC in between, so they keep their own caps.
const CHAIN_EXTRA = {
  bw: [['Alder','Ghetsis']],
  sm: [['Guzma','Lusamine']]
};
function chains(){
  const L = battleList();
  const out = [];
  for (let i = 0; i < L.length; ){
    if (!isGaunt(L[i])){ i++; continue; }
    let e = i;
    while (e + 1 < L.length && isGaunt(L[e + 1])) e++;
    if (e > i) out.push([i, e]);
    i = e + 1;
  }
  for (const [from, to] of (CHAIN_EXTRA[S.game] || [])){
    const s = L.findIndex(b => b[0] === from);
    if (s < 0) continue;
    let f = -1;
    for (let j = s + 1; j < L.length; j++) if (L[j][0] === to){ f = j; break; }
    if (f < 0) continue;
    const touch = out.find(c => s <= c[1] + 1 && f >= c[0] - 1);
    if (touch){ touch[0] = Math.min(touch[0], s); touch[1] = Math.max(touch[1], f); }
    else out.push([s, f]);
  }
  return out.sort((p, q) => p[0] - q[0]);
}
function chainAt(i){ return chains().find(c => i >= c[0] && i <= c[1]) || null; }
// The last battle of a chain is where all the deferred bookkeeping lands.
function chainEnd(i){ const c = chainAt(i); return !c || i === c[1]; }

// The chain the next unbeaten major sits in, or null.
function gauntlet(){
  const nx = nextMajor();
  if (!nx) return null;
  const c = chainAt(nx.i);
  if (!c) return null;
  return { a: c[0], z: c[1], list: battleList() };
}
// True once you're actually inside it — one of its battles is already won, so there has been
// no PC since. Standing outside with the first of them next is not "inside".
function inGauntlet(){
  const g = gauntlet();
  if (!g) return false;
  for (let i = g.a; i <= g.z; i++) if (S.beat[i]) return true;
  return false;
}
function gauntletAce(){
  const g = gauntlet();
  if (!g) return null;
  let top = null;
  for (let i = g.a; i <= g.z; i++){
    const lv = g.list[i][4];
    if (lv && (top === null || lv > top)) top = lv;
  }
  return top;
}
function gauntletName(){
  const g = gauntlet();
  if (!g) return '';
  for (let i = g.z; i >= g.a; i--)
    if (g.list[i][3] === 'champ') return `the Elite Four and ${g.list[i][0]}`;
  return `${g.list[g.a][0]} → ${g.list[g.z][0]}`;
}

// A wall is either a single battle or a whole Rule 37 chain; either way it gets one cap and
// one confirmation. Keying the chain by its bounds means correcting it overrides the block,
// not just the member you happened to be standing in front of.
function wallKey(){
  const g = gauntlet();
  if (g) return 'g' + g.a + '-' + g.z;
  const nx = nextMajor();
  return nx ? 'b' + nx.i : null;
}
function wallName(){
  const g = gauntlet();
  if (g) return gauntletName();
  const nx = nextMajor();
  return nx ? nx.b[0] : '';
}
const capConfirmed = () => { const k = wallKey(); return !k || !!S.capOK[k]; };

function capNum(){ const n = parseInt(S.cap, 10); return isFinite(n) && n > 0 ? n : null; }
// Ace levels ship with most games (scraped from Serebii); Decay's come from its dev sheet.
// The ace level of one battle, honouring a correction you have made for that wall.
function aceAt(i){
  const b = battleList()[i];
  if (!b || isPost(b)) return 0;
  const c = chainAt(i);
  const fix = S.capFix[c ? 'g' + c[0] + '-' + c[1] : 'b' + i];
  return fix != null ? fix : (b[4] || 0);
}
// The ace of the wall in front of you, on its own — a chain counts as its strongest member.
function wallAce(){
  const nx = nextMajor();
  if (!nx) return null;
  const g = gauntlet();
  if (!g) return aceAt(nx.i) || null;
  let top = 0;
  for (let i = g.a; i <= g.z; i++) top = Math.max(top, aceAt(i));
  return top || null;
}
// The cap itself, which is that ace or the highest one you have already faced, whichever is
// greater. Caps only ever rise: you were legally allowed to reach the earlier one.
function knownAce(){
  const nx = nextMajor();
  if (!nx) return null;
  const g = gauntlet();
  const upto = g ? g.z : nx.i;
  let top = 0;
  for (let i = 0; i <= upto; i++) top = Math.max(top, aceAt(i));
  return top || null;
}
function syncCap(){
  const a = knownAce();
  if (!S.levelCap || !a) return false;
  if (String(S.cap) === String(a)) return false;
  S.cap = String(a);
  return true;
}
function overCap(){
  const c = capNum();
  if (!S.levelCap || !c) return [];
  // Inside the gauntlet the whole block is "during the battle" (Rule 29), so growing past
  // the ceiling mid-run costs nothing — there'd be no way to answer for it anyway.
  if (inGauntlet()) return [];
  return party().filter(m => parseInt(m.level, 10) > c);
}
// Fired once per wall from postBattleFlow. Yes locks the shipped number in; No takes yours.
function confirmCap(){
  const k = wallKey();
  if (!k){ closeSheet(); return; }
  const lv = wallAce();
  const cap = knownAce();
  if (lv == null) return askCap();          // nothing on file at all — just ask for the number
  sheet(`<h3>📏 Cap for ${esc(wallName())}</h3>
    <p class="note" style="margin:0 0 4px">Next up is <b>${esc(wallName())}</b>, and we have that
      ace at <b>Lv ${lv}</b>${gauntlet() ? ' — the highest in the whole run, since it counts as one wall (Rule 37)' : ''}.</p>
    <div style="text-align:center;font-size:44px;font-weight:900;color:var(--gold);
      line-height:1.1;margin:10px 0">Lv ${lv}</div>
    ${cap > lv ? `<p class="note" style="margin:0 0 4px;color:var(--gold)">Your cap stays at
      <b>Lv ${cap}</b> — this wall is weaker than one you have already beaten, and a cap never
      drops (Rule 29).</p>` : ''}
    <p class="note" style="margin:0 0 12px">Is that ace right? Answer once and it is remembered
      for the rest of the run.</p>
    <div class="acts">
      <button class="btn" onclick="acceptCap()">✓ Yes, Lv ${lv}</button>
    </div>
    <div class="acts">
      <button class="btn ghost" onclick="correctCap()">✎ No — the real level is…</button>
    </div>`);
}
function acceptCap(){
  const k = wallKey();
  if (!k) return closeSheet();
  S.capOK[k] = true;
  S.cap = String(knownAce());
  logIt('📏', `Cap <b>Lv ${S.cap}</b> for <b>${esc(wallName())}</b>, confirmed. Won't ask again.`);
  save(); render(); closeSheet();
  if (discharged().length) rotateGate();
}
function correctCap(){
  const lv = wallAce();
  sheet(`<h3>📏 ${esc(wallName())}'s real ace level</h3>
    <p class="note" style="margin:0 0 10px">We had <b>Lv ${lv == null ? '—' : lv}</b>. What is it
      actually? This overrides the bundled figure for the rest of the run.</p>
    <label for="capIn">Ace level</label>
    <input type="number" id="capIn" min="1" max="100" inputmode="numeric" value="${esc(lv || '')}">
    <div class="acts">
      <button class="btn ghost" onclick="confirmCap()">← Back</button>
      <button class="btn" onclick="saveCapFix()">Save</button>
    </div>`);
  setTimeout(()=>{ const el = document.getElementById('capIn'); if (el){ el.focus(); el.select(); } }, 120);
}
function saveCapFix(){
  const k = wallKey();
  const v = parseInt((document.getElementById('capIn') || {}).value, 10);
  if (!k || !isFinite(v) || v < 1 || v > 100) return;
  S.capFix[k] = v;
  S.capOK[k] = true;
  S.cap = String(v);
  logIt('📏', `Cap corrected to <b>Lv ${v}</b> for <b>${esc(wallName())}</b> — the bundled figure
    was wrong. Won't ask again.`);
  save(); render(); closeSheet();
  if (discharged().length) rotateGate();
}

function askCap(){
  const nx = nextMajor();
  const g = gauntlet();
  sheet(`<h3>📏 Level cap</h3>
    <p class="note" style="margin:0 0 10px">${g
      ? `You're at <b>${esc(gauntletName())}</b>, which counts as <b>one wall</b> — there's no PC
         between them, so a single cap covers the whole run and it's the highest ace in it
         (Rule 37). Levelling up during the gauntlet is free.`
      : nx
      ? `What level is <b>${esc(nx.b[0])}</b>'s highest Pokémon? Nobody may go above it.`
      : 'No major battles left — set a cap if you still want one.'}</p>
    <label for="capIn">Cap level</label>
    <input type="number" id="capIn" min="1" max="100" inputmode="numeric"
      value="${esc(knownAce() || S.cap)}" placeholder="e.g. 14">
    ${knownAce() ? '<p class="note" style="margin:8px 0 0">Filled in from the bundled data for this game.</p>'
      : '<p class="note" style="margin:8px 0 0">No ace level on file for this battle — check it in-game and type it in.</p>'}
    <div class="acts">
      <button class="btn ghost" onclick="closeSheet()">Cancel</button>
      <button class="btn" onclick="setCap()">Set cap</button>
    </div>`);
  setTimeout(()=>document.getElementById('capIn').focus(), 120);
}
function setCap(){
  const v = document.getElementById('capIn').value.trim();
  const lv = parseInt(v, 10);
  S.cap = v;
  // Remember it against this wall, so a game with no bundled ace levels is asked once too.
  const k = wallKey();
  if (k && isFinite(lv) && lv > 0){ S.capFix[k] = lv; S.capOK[k] = true; }
  logIt('📏', `Level cap set to <b>Lv ${esc(v)}</b>${wallName()?` for ${esc(wallName())}`:''}. Won't ask again.`);
  save(); render(); closeSheet();
  if (overCap().length) rotateGate();
}

/* ---------- run management ---------- */
function modeOf(r){
  return r.mode === 'permadeath' ? '☠️ Permadeath' : r.mode === 'rotation' ? '🔁 Rotation' : 'no mode set';
}
function runLabel(r){
  const g = r.game === 'custom' ? 'ROM hack' : (GAMES[r.game] ? GAMES[r.game].name : 'no game');
  const m = r.mode === 'permadeath' ? '☠️' : r.mode === 'rotation' ? '🔁' : '';
  return `${m} ${g}`.trim();
}
function switchRun(id){
  if (id === DB.active){ closeSheet(); return; }
  DB.active = id; S = activeRun();
  tab = 'party'; boxSort = 'slot';
  save(); render(); closeSheet();
}
function newRun(){
  const r = blankRun('New run', S);      // carry the naming theme and API key over
  DB.runs.push(r); DB.active = r.id; S = r;
  tab = 'party';
  save(); render(); closeSheet();
}
function renameRun(id){
  const r = DB.runs.find(x=>x.id===id); if (!r) return;
  const n = prompt('Name this run:', r.name);
  if (n === null) return;
  r.name = n.trim() || r.name;
  save(); render(); openRuns();
}
function deleteRun(id){
  const r = DB.runs.find(x=>x.id===id); if (!r) return;
  if (!confirm(`Delete "${r.name}" for good? ${r.mons.length} Pokémon and its whole history go with it.`)) return;
  DB.runs = DB.runs.filter(x=>x.id!==id);
  if (!DB.runs.length) DB.runs.push(blankRun('My first run', S));
  if (!DB.runs.some(x=>x.id===DB.active)) DB.active = DB.runs[0].id;
  S = activeRun();
  save(); render(); openRuns();
}
function openRuns(){
  const rows = DB.runs.map(r=>{
    const p = r.mons.filter(m=>m.status==='party').length;
    const fell = r.mons.filter(m=>m.status==='fallen').length;
    const majors = (()=>{ try{ return Object.keys(r.beat||{}).length; }catch(e){ return 0; } })();
    const on = r.id === DB.active;
    return `<div class="runrow ${on?'on':''}">
      <div class="runmain" onclick="switchRun('${r.id}')">
        <div class="runname">${esc(r.name)} ${on?'<span class="nowtag">ACTIVE</span>':''}</div>
        <div class="runmeta">${esc(runLabel(r).endsWith(r.name) ? modeOf(r) : runLabel(r))} · ${p}/6 fielded · ${r.mons.length} caught${
          fell?` · ${fell} fallen`:''} · ${majors} major${majors===1?'':'s'}</div>
      </div>
      <button class="runbtn" onclick="renameRun('${r.id}')" title="Rename">✏️</button>
      <button class="runbtn" onclick="deleteRun('${r.id}')" title="Delete">🗑️</button>
    </div>`;
  }).join('');
  sheet(`<h3>🗂️ Your runs</h3>
    <p class="note" style="margin:0 0 10px">Each run keeps its own party, Box, history, game,
      mode and encounter rule. Tap one to switch — play as many at once as you like.</p>
    ${rows}
    <div class="acts"><button class="btn" onclick="newRun()">＋ Start a new run</button></div>
    <div class="acts"><button class="btn ghost" onclick="closeSheet()">Close</button></div>`);
}

function party(){ return S.mons.filter(m=>m.status==='party').sort((a,b)=>a.slot-b.slot); }
function boxed(){ return S.mons.filter(m=>m.status==='boxed'); }
function fallen(){ return S.mons.filter(m=>m.status==='fallen'); }
function living(){ return S.mons.filter(m=>m.status!=='fallen'); }
const isPD = () => S.mode === 'permadeath';

/* ---------- optional dials ---------- */
const TYPE_LIST = ['normal','fire','water','electric','grass','ice','fighting','poison','ground',
  'flying','psychic','bug','rock','ghost','dragon','dark','steel','fairy'];
// Types ship for the 1025 national-dex species; fan-game species have none, and the
// purity check deliberately waves those through rather than guessing.
// Decay is a Gen-8-era fan game and its PBS typings are already final, so only the mainline
// games get rewound. A ROM hack has no known era, so it's treated as current.
function gameGen(){
  const g = GAMES[S.game];
  return g && g.gen ? g.gen : 9;
}
function typesOf(species){
  if (isDecay()){
    const d = DTYPES[norm(species)];
    return d ? d.slice() : [];        // no entry: unknown, and purity waves it through
  }
  const dex = dexOf(species);
  if (!dex) return [];
  const p = TYPES_PAST[dex];
  if (p){
    const gen = gameGen();
    for (const g of Object.keys(p).map(Number).sort((a,b)=>a-b))
      if (gen <= g) return p[g].slice();
  }
  return (TYPES[dex] || []).slice();
}
// What a species became later, so the detail sheet can explain an unfamiliar typing.
function typeEraNote(species){
  const dex = dexOf(species);
  const p = dex && TYPES_PAST[dex];
  if (!p) return '';
  const now = (TYPES[dex] || []).join(' / ');
  const era = typesOf(species).join(' / ');
  if (!now || now === era) return '';
  const changed = Math.max(...Object.keys(p).map(Number)) + 1;
  return `${esc(pretty(now))} from ${esc(GENS[changed] || 'later games')} onward`;
}
function monTypes(m){
  const era = typesOf(m.species);
  return era.length ? era : ((m.types || []).slice());
}
const bloodOn = () => !!S.blood;

// Decay's roster is keyed by normalised name; keep a reverse map for display.
const DNAME = {};
for (const [nm, k] of (typeof DECAY_ROSTER !== 'undefined' ? DECAY_ROSTER : [])) DNAME[k] = nm;

// What this Pokémon can become, as display names, filtered to what the game actually has.
function evoTargets(species){
  if (isDecay()) return (DEVOS[norm(species)] || []).map(k => DNAME[k] || pretty(k));
  const d = dexOf(species);
  if (!d) return [];
  const cap = GENMAX[gameGen()] || 1025;
  return (EVOS[d] || []).filter(x => x <= cap).map(x => pretty(DEX[x-1] || '')).filter(Boolean);
}
function houseType(slot){ return S.bloodType[slot] || null; }
// Rule 33: the founder fixes a lineage's type; later members must share it or they're Strays.
function pureFor(m){
  if (!bloodOn()) return true;
  const t = houseType(m.slot);
  if (!t) return true;
  const ts = monTypes(m);
  return ts.length ? ts.includes(t) : true;
}
function heirs(slot){ return lineage(slot).filter(x => x.status === 'boxed' && pureFor(x)); }
function isStray(m){ return bloodOn() && m.status === 'boxed' && !pureFor(m); }
// A chair that empties with nobody eligible ends the dynasty — the number is free to refound.
function checkDynasty(slot){
  if (!bloodOn() || inSlot(slot) || heirs(slot).length || !S.bloodType[slot]) return;
  logIt('🧬', `Lineage <b>${slot}</b>'s ${esc(pretty(S.bloodType[slot]))} dynasty has no eligible
    heir — the number is open for a new founder.`);
  delete S.bloodType[slot];
}
// Straight from pokemondb.net's type badges.
const TYPE_COL = {
  normal:'#aaaa99', fire:'#ff4422', water:'#3399ff', electric:'#ffcc33', grass:'#77cc55',
  ice:'#66ccff', fighting:'#bb5544', poison:'#aa5599', ground:'#ddbb55', flying:'#8899ff',
  psychic:'#ff5599', bug:'#aabb22', rock:'#bbaa66', ghost:'#6666bb', dragon:'#7766ee',
  dark:'#775544', steel:'#aaaabb', fairy:'#ee99ee'
};
const typeCol = x => TYPE_COL[String(x||'').toLowerCase()] || null;
// One badge per type. Anything the datasets don't know about renders as a neutral pill
// rather than vanishing, so a fan-game species still shows what you recorded.
function typeBadges(types, cls){
  const list = (types || []).filter(Boolean);
  if (!list.length) return '';
  return `<div class="types ${cls === 'lg' ? 'big' : ''}">` + list.map(x =>
    `<span class="tbadge ${cls || ''}" style="background:${typeCol(x) || 'var(--card2)'}${
      typeCol(x) ? '' : ';color:var(--dim);text-shadow:none'}">${esc(pretty(x))}</span>`).join('') + '</div>';
}
function monBadges(m, cls){ return typeBadges(monTypes(m), cls); }
// The chair itself wears the type: a solid fill for one, a hard split for two.
function typeFill(types){
  const c1 = typeCol((types||[])[0]), c2 = typeCol((types||[])[1]);
  if (!c1) return '';
  return c2 && c2 !== c1
    ? `background:linear-gradient(135deg,${c1} 0 48%,${c2} 52% 100%);color:#fff;` +
      'border-color:transparent;text-shadow:1px 1px 2px rgba(0,0,0,.55)'
    : `background:${c1};color:#fff;border-color:transparent;text-shadow:1px 1px 2px rgba(0,0,0,.55)`;
}
// …and the card picks up a wash of the same colour so the grid reads by type at a glance.
function typeTint(types){
  const c1 = typeCol((types||[])[0]);
  if (!c1) return '';
  const c2 = typeCol((types||[])[1]) || c1;
  return `border-color:${c1}59;background:linear-gradient(135deg,${c1}26,${c2}12 55%,var(--card))`;
}

function typeChip(t){
  return `<span style="display:inline-block;padding:1px 7px;border:1px solid var(--line);
    border-radius:99px;font-size:11px;font-weight:800;letter-spacing:.04em">${esc(pretty(t))}</span>`;
}
// A dual-type founder picks which side the dynasty follows; an unknown species offers all 18.
function askHouseType(m){
  const ts = monTypes(m);
  const opts = ts.length ? ts : TYPE_LIST;
  if (ts.length === 1){ setHouseType(m.slot, ts[0]); return afterCatch(m.id); }
  sheet(`<h3>🧬 Found lineage ${m.slot}</h3>
    <p class="note" style="margin:0 0 12px"><b>${esc(m.nick)}</b> is the founder, so it fixes what
      lineage ${m.slot} is. Every future member of this number must share the type you pick
      (Rule 33).${ts.length ? '' : ' No type on file for this species — pick it yourself.'}</p>
    <div class="pips" style="flex-wrap:wrap">${opts.map(x =>
      `<button class="pipbtn" style="width:auto;padding:0 12px;font-size:13px"
        onclick="setHouseType(${m.slot},'${x}');afterCatch(${m.id})">${esc(pretty(x))}</button>`).join('')}</div>`);
  lockSheet(true);
}
function setHouseType(slot, t){
  S.bloodType[slot] = t;
  logIt('🧬', `Lineage <b>${slot}</b> is a <b>${esc(pretty(t))}</b> dynasty from here on.`);
  save();
}
// Runs the post-catch chain in order: found the dynasty, then roll the tour.
function afterCatch(id){
  const m = mon(id);
  if (!m){ closeSheet(); render(); return; }
  if (m.status === 'party' && bloodOn() && !houseType(m.slot)) return askHouseType(m);
  if (m.status === 'party' && tours() && m.term == null) return rollTourFor(m.id);
  closeSheet(); render();
}
function inSlot(n){ return S.mons.find(m=>m.status==='party' && m.slot===n); }
function lineage(n){ return S.mons.filter(m=>m.slot===n); }
function mon(id){ return S.mons.find(m=>m.id===id); }

function logIt(icon, html){
  S.log.unshift({ id:S.seq++, icon, html, ts:Date.now() });
  if (S.log.length > 400) S.log.length = 400;    // a long dex run would run to thousands
}
function ago(ts){
  const s = Math.floor((Date.now()-ts)/1000);
  if (s<60) return 'just now';
  if (s<3600) return Math.floor(s/60)+'m ago';
  if (s<86400) return Math.floor(s/3600)+'h ago';
  const d = new Date(ts);
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric'}) + ' · ' +
         d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
}
function esc(s){ return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function themeMeta(code){
  if (POOLS[code]) return [POOLS[code].label, POOLS[code].icon, true];
  if (LIVE_THEMES[code]) return [...LIVE_THEMES[code], false];
  return ['Norse Myth','⚔️',true];
}

/* =========================================================
   RENDER
   ========================================================= */
function sweepDynasties(){
  if (!S.blood) return;
  let changed = false;
  for (let i = 1; i <= 6; i++){
    if (inSlot(i) || heirs(i).length || !S.bloodType[i]) continue;
    checkDynasty(i);
    changed = true;
  }
  if (changed) save();
}
function render(){
  loadDecayPack();
  sweepDynasties();
  const p = party(), b = boxed();
  document.getElementById('cParty').textContent = p.length;
  document.getElementById('cBox').textContent = b.length;
  document.getElementById('cLog').textContent = S.log.length;
  if (S.levelCap && !S.cap) syncCap();
  document.getElementById('cBattles').textContent = beatenCount();

  document.getElementById('runName').innerHTML = esc(S.name) +
    ` <span style="color:var(--dim)">· ${DB.runs.length} run${DB.runs.length===1?'':'s'} ›</span>`;
  document.getElementById('stats').innerHTML =
    `${modeName()} · ${gameName()} · <b>${p.length}/6</b> fielded · ${S.mons.length} caught · ${
      b.length} benched${isPD() && fallen().length ? ` · <b style="color:var(--red)">${
      fallen().length} fallen</b>` : ''}`;
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on', x.dataset.tab===tab));
  document.getElementById('view').innerHTML =
    tab==='party' ? viewParty() : tab==='box' ? viewBox() :
    tab==='progress' ? viewProgress() : viewLog();
  paintFab();
  save();
}

// the first major battle you haven't ticked
function nextMajor(){
  const list = battleList();
  for (let i = 0; i < list.length; i++) if (!S.beat[i] && !isPost(list[i])) return { i, b: list[i] };
  return null;
}

// Beating the next wall from the Overview tab. Everything downstream — tours, the faint
// question, the cap, Rule 37's chains — is toggleBattle's job, so this just finds the index.
function beatNext(){
  const nx = nextMajor();
  if (!nx) return;
  toggleBattle(nx.i);
}

function viewParty(){
  let h = '';
  const nx = nextMajor();
  if (nx){
    // Rules 26–27 come first: if somebody owes a handover, toggleBattle refuses anyway, so say
    // so on the button rather than letting it look broken.
    const owed = discharged().length || needsTour().length;
    h += `<div class="nextup" onclick="tab='progress';pane='battles';render()">
      <div class="nlabel">NEXT MAJOR</div>
      <div class="nname">${esc(nx.b[0])}<span>${esc(nx.b[1]||'')}${nx.b[2]?' · '+esc(nx.b[2]):''}${
        nx.b[4]?` · Ace Level ${nx.b[4]}`:''}</span></div>
      <button class="beat ${owed?'locked':''}" onclick="event.stopPropagation();beatNext()"
        title="${owed?'Sort the rotation out first':'Mark this major as beaten'}">${
        owed ? '⚠ rotate first' : '✓ Beat it'}</button>
      <div class="ngo">›</div></div>`;
  }
  // No standing cap button — the cap is confirmed once per wall after the major that brings it
  // into range, and shown on the NEXT MAJOR line. This only speaks up when something is wrong,
  // because an over-cap Pokémon with no heir wouldn't surface anywhere else.
  if (S.levelCap){
    const oc = overCap();
    if (oc.length) h += `<div class="nextup warn">
      <div class="nlabel">OVER</div>
      <div class="nname">${esc(oc.map(m=>`${m.nick} Lv ${m.level}`).join(', '))}<span>past the
        Lv ${capNum()} cap — ${oc.some(m=>hasHeir(m))
          ? 'hand the chair over at the next PC (Rule 29)'
          : 'no heir in that lineage, so it sits out until the cap rises'}</span></div>
      </div>`;
  }
  // Debts pile up invisibly inside the gauntlet, so show what's waiting.
  if (inGauntlet()){
    const owed = party().filter(m => m.winded || (tours() && m.term === 0));
    if (owed.length) h += `<div class="nextup" onclick="tab='progress';pane='battles';render()">
      <div class="nlabel">HELD</div>
      <div class="nname">${owed.map(m=>esc(m.nick)).join(', ')}<span>handover owed — waits until
        ${esc(gauntletName())} is done (Rule 37)</span></div>
      <div class="ngo">›</div></div>`;
  }
  const dc = discharged();
  if (dc.length) h += `<div class="nextup warn" onclick="rotateGate()">
      <div class="nlabel">ROTATE</div>
      <div class="nname">${dc.map(m=>esc(m.nick)).join(', ')}<span>tour over — hand the chair on (Rules 26–27)</span></div>
      <div class="ngo">›</div></div>`;
  const nt = needsTour();
  if (nt.length) h += `<div class="nextup roll" onclick="openTourRolls()">
      <div class="nlabel">TOUR</div>
      <div class="nname">${nt.map(m=>esc(m.nick)).join(', ')}<span>roll 1d${S.tourDie} for how long they serve (Rule 26)</span></div>
      <div class="ngo">›</div></div>`;
  h += `<h2 class="sec">Lineages <span class="tip">one Pokémon per number — permanent</span></h2><div class="grid">`;
  for (let n=1;n<=6;n++){
    const m = inSlot(n), depth = lineage(n).length, bench = lineage(n).filter(x=>x.status==='boxed').length;
    if (m){
      const ts = monTypes(m);
      h += `<div class="slot filled" style="${typeTint(ts)}" onclick="openDetail(${m.id})">
        <div class="num" style="${typeFill(ts)}">${n}</div>
        ${portrait(m)}
        <div class="body">
          <div class="nick">${m.shiny?'✨ ':''}${esc(m.nick)} ${genderMark(m.gender)}</div>
          <div class="meta">${esc(pretty(m.species))}${m.level?` · Lv ${m.level}`:''}</div>
          ${(m.nature || m.ability) ? `<div class="attrs">${
            m.nature ? `<span><i>Nature</i> ${esc(m.nature)}${(()=>{ const sh = natureShort(m.nature);
              return sh ? ` <em>${sh}</em>` : ''; })()}</span>` : ''}${
            m.ability ? `<span><i>Ability</i> ${esc(m.ability)}</span>` : ''}</div>` : ''}
          ${monBadges(m)}
          <div class="quick">
            <button onclick="event.stopPropagation();bumpLevel(${m.id},1)" title="Level up">+1</button>
            <button onclick="event.stopPropagation();askLevel(${m.id})" title="Set level">Lv ${
              esc(m.level || '—')}</button>
            ${evoTargets(m.species).length
              ? `<button class="evo" onclick="event.stopPropagation();askEvolve(${m.id})">⤴ Evolve</button>`
              : ''}
          </div>
        </div>
        ${bench?`<div class="chip depth">+${bench}</div>`:''}
        ${m.winded ? '<div class="chip wind">💨 tour over</div>'
          : m.term === 0 ? '<div class="chip wind">📜 tour up</div>'
          : m.term == null && tours() ? '<div class="chip roll">⏳ roll tour</div>'
          : tours() ? `<div class="chip term">📜 ${m.term}</div>` : ''}
      </div>`;
    } else {
      h += `<div class="slot vacant">
        <div class="num">${n}</div>
        <div class="body">
          <div class="vac">Empty chair</div>
          <div class="meta">${bench?`${bench} waiting in the Box`:depth?'lineage all boxed':'no lineage yet'}</div>
        </div>
      </div>`;
    }
  }
  h += '</div>';
  // Battle order is deliberately not tracked — it changes constantly in play and the
  // rules leave it entirely free (Rule 11). The lineage grid is the part that matters.

  if (!S.mons.length){
    h += `<h2 class="sec">Run setup <span class="tip">before your first catch</span></h2>
      <div class="setup">
        <div class="step ${S.mode?'done':''}" onclick="openModePicker()">
          <div class="tick">${S.mode?'✓':'1'}</div>
          <div class="binfo"><div class="bname">Mode</div>
            <div class="bmeta">${S.mode?esc(modeName()):'Rotation or Permadeath — locked once you start'}</div></div>
        </div>
        <div class="step ${S.game?'done':''}" onclick="openGamePicker()">
          <div class="tick">${S.game?'✓':'2'}</div>
          <div class="binfo"><div class="bname">Game</div>
            <div class="bmeta">${S.game?esc(gameName()):'Sets up your major-battle checklist'}</div></div>
        </div>
        <div class="step ${S.encMode?'done':''}" onclick="openEncModePicker()">
          <div class="tick">${S.encMode?'✓':'3'}</div>
          <div class="binfo"><div class="bname">Encounter rule</div>
            <div class="bmeta">${S.encMode?esc(encModeName()):'First encounter, or spin the wheel'}</div></div>
        </div>
        <div class="step done" onclick="openHouseRules()">
          <div class="tick">4</div>
          <div class="binfo"><div class="bname">Optional dials</div>
            <div class="bmeta">${(()=>{
              const on = [];
              if (S.levelCap) on.push('level cap');
              if (S.succession === 'random') on.push('random succession');
              if (S.blood) on.push('bloodline purity');
              if (S.mlock) on.push('method lock');
              if (S.shinyClause) on.push('shiny clause');
              if (!isPD() && S.tourDie !== 6) on.push('tours 1d' + S.tourDie);
              if (S.starter !== 'full') on.push(S.starter === 'half' ? 'half starter' : 'traditional starter');
              return on.length ? '<b>' + on.join('</b> · <b>') + '</b>' : 'seven switches — all off';
            })()}</div></div>
        </div>
      </div>
      <button class="btn" style="margin-top:12px" onclick="openStarter()">🔥 ${
        S.starter==='trad' ? 'Pick your starter' : 'Roll for starter'}</button>
      ${(!S.mode||!S.game)?'<p class="note" style="text-align:center">You can skip straight to the starter — the setup steps stay available until you catch something.</p>':''}`;
  }
  return h;
}

/* =========================================================
   MODE: ROTATION vs PERMADEATH (Rule 8)
   Locked once the first Pokémon is caught.
   ========================================================= */
function modeName(){
  return S.mode === 'permadeath' ? '☠️ Permadeath' : S.mode === 'rotation' ? '🔁 Rotation' : 'No mode set';
}
function openModePicker(){
  const locked = S.mons.length > 0;
  sheet(`<h3>Choose your mode</h3>
    <p class="note" style="margin:0 0 14px">What does a faint cost you? Everything else about
      Lineagelock is identical either way. ${locked
        ? '<b style="color:var(--gold)">Locked — this run has already started (Rule 8).</b>'
        : 'Locked in once you catch your first Pokémon.'}</p>
    <div class="modecard ${S.mode==='rotation'?'on':''}" ${locked?'':'onclick="setMode(\'rotation\')"'}>
      <div class="mhead">🔁 Rotation<span>${S.mode==='rotation'?'CURRENT':''}</span></div>
      <div class="mbody">A faint is just a faint — heal up and carry on. Nobody is ever lost.
        Your six change because the rules make them change, not because something died.</div>
    </div>
    <div class="modecard ${S.mode==='permadeath'?'on':''}" ${locked?'':'onclick="setMode(\'permadeath\')"'}>
      <div class="mhead">☠️ Permadeath<span>${S.mode==='permadeath'?'CURRENT':''}</span></div>
      <div class="mbody">A faint is final. The Pokémon is <b>Fallen</b> and its chair passes to the next
        living member of that same lineage — or sits empty until the die refills it. The run can be lost.</div>
    </div>
    <div class="acts"><button class="btn ghost" onclick="closeSheet()">${locked?'Close':'Cancel'}</button></div>`);
}
function setMode(m){
  if (S.mons.length){ alert('This run has already started — the mode is locked (Rule 8).'); return; }
  S.mode = m;
  logIt(m==='permadeath'?'☠️':'🔁', `Mode set to <b>${esc(modeName())}</b>.`);
  save(); render(); closeSheet();
}

// A faint in Permadeath mode: the Pokémon is out of the run, and its chair passes down the lineage.
function markFallen(id){
  const m = mon(id);
  if (!m || !isPD() || m.status === 'fallen') return;
  if (!confirm(`${m.nick} faints and is gone for the rest of the run. This cannot be undone. Continue?`)) return;
  const wasFielded = m.status === 'party';
  m.status = 'fallen';
  m.fellAt = Date.now();
  const heirs = lineage(m.slot).filter(x=>x.status === 'boxed');
  logIt('💀', `<b>${esc(m.nick)}</b> the ${esc(pretty(m.species))} has <b>fallen</b> — lineage ${
    m.slot}${heirs.length ? ` passes to its bench (${heirs.length} left)` : ' has no living heir'}.`);
  save(); render(); closeSheet();
  if (!living().length){
    sheet(`<h3>☠️ The run is over</h3>
      <p class="note">Every Pokémon you owned has fallen (Rule 12). Here's how it went.</p>
      <div class="acts"><button class="btn" onclick="openSummary()">📖 Run summary</button></div>`);
    return;
  }
  if (wasFielded && heirs.length) benchList(m.slot);
}
